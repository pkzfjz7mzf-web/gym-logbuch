function metricFor(exId){
  const def=EX[exId], bw=+state.settings.bodyweight||0;
  if(def.load==='reps') return {label:'Wiederholungen gesamt', unit:'Wdh.', fn:sets=>sets.reduce((a,x)=>a+(x.r||0),0)};
  if(def.equip==='assist' && !bw) return {label:'Hilfe in kg, weniger ist stärker', unit:'kg', fn:sets=>Math.min(...sets.map(x=>x.w||0))};
  if(def.equip==='bw' && (!bw || !def.bwLoad)) return {label:'Beste Wiederholungszahl', unit:'Wdh.', fn:sets=>Math.max(...sets.map(x=>x.r||0))};
  return {label:'Geschätztes 1RM (Epley, inkl. RIR)', unit:'kg', fn:sets=>bestE1rm(sets,def)};
}

function niceScale(min,max,n){
  if(!(isFinite(min)&&isFinite(max))){ min=0; max=1; }
  if(min===max){ min-=1; max+=1; }
  const step0=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), norm=step0/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo; v<=hi+step/2; v+=step) ticks.push(rnd(v));
  return [lo,hi,ticks];
}

function lineChart(pts, unit){
  const W=340,H=190,L=38,R=30,T=18,B=26;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0){ x0-=3*864e5; x1+=3*864e5; }
  const [y0,y1,ticks]=niceScale(Math.min(...ys), Math.max(...ys), 4);
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';
  ticks.forEach(v=>{ const y=sy(v).toFixed(1); g+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ch-lab" x="'+(L-6)+'" y="'+(+y+4)+'" text-anchor="end">'+fmtW(v)+'</text>'; });
  const fd=x=>{ const d=new Date(x); return d.getDate()+'.'+(d.getMonth()+1)+'.'; };
  g+='<text class="ch-lab" x="'+sx(xs[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="start">'+fd(xs[0])+'</text>';
  if(pts.length>1) g+='<text class="ch-lab" x="'+sx(xs[xs.length-1]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="end">'+fd(xs[xs.length-1])+'</text>';
  const line=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  if(pts.length>1) g+='<path class="ch-area" d="'+line+' L'+sx(xs[xs.length-1]).toFixed(1)+' '+sy(y0).toFixed(1)+' L'+sx(xs[0]).toFixed(1)+' '+sy(y0).toFixed(1)+' Z"/><path class="ch-line" d="'+line+'"/>';
  pts.forEach((p,i)=>{ const last=i===pts.length-1; g+='<circle class="'+(last?'ch-last':'ch-dot')+'" cx="'+sx(p.x).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="'+(last?5.5:3.5)+'"/>'; });
  const lp=pts[pts.length-1], lx=sx(lp.x), ly=sy(lp.y);
  g+='<text class="ch-val" x="'+Math.min(W-2, lx+0).toFixed(1)+'" y="'+Math.max(13, ly-10).toFixed(1)+'" text-anchor="end">'+fmtW(rnd(lp.y))+(unit==='kg'?' kg':'')+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Verlauf">'+g+'</svg>';
}

function viewProgress(){
  const ds=doneSessions();
  if(!ds.length) return '<div class="empty">Nach den ersten Einheiten erscheinen hier deine Regelmässigkeit, Kurven pro Übung und das Wochenvolumen pro Muskelgruppe.</div>';
  let h='';
  // Regelmässigkeit
  const t=todayStr(), ws0=weekStart(t);
  const weeks=[]; for(let i=11;i>=0;i--){ const ws=addDays(ws0,-7*i); const ss=weekSessions(ws); weeks.push({ws, gym:ss.filter(s=>s.type!=='H').length, home:ss.filter(s=>s.type==='H').length}); }
  const tot=weeks.reduce((a,w)=>a+w.gym,0), hit=weeks.filter(w=>w.gym>=1).length;
  h+='<section class="sec"><div class="sec-h"><h2 class="eyebrow">Regelmässigkeit · 12 Wochen</h2></div><div class="panel"><div class="grid12">'+weeks.map(w=>'<div class="wk'+(w.gym>=2?' c2':w.gym===1?' c1':'')+(w.ws===ws0?' now':'')+'" title="KW '+isoWeek(w.ws)+': '+w.gym+' Gym'+(w.home?', '+w.home+' Heim':'')+'">'+(w.gym||'')+'</div>').join('')+'</div><div class="grid12">'+weeks.map((w,i)=>'<div class="wk-l">'+(i%2===1||i===11?isoWeek(w.ws):'')+'</div>').join('')+'</div><p class="muted" style="margin:0;font-size:14px">'+tot+' Gym-Einheiten, Baseline in '+hit+' von 12 Wochen. Zahl = Einheiten pro Kalenderwoche.</p></div></section>';

  // Übungen
  const present=ORDER.filter(id=>ds.some(s=>s.blocks.some(b=>b.items.some(e=>e.ex===id && !e.skipped && e.sets.some(x=>x.done)))));
  if(present.length){
    if(!state.progEx || !present.includes(state.progEx)) state.progEx=present[0];
    const ex=state.progEx, def=EX[ex], mt=metricFor(ex);
    const hist=perfHistory(ex, Infinity, null).slice().reverse();
    const byS=[]; hist.forEach(hh=>{ const v=mt.fn(hh.sets); if(v>0 || def.equip==='assist') byS.push({x:hh.s.startedAt, y:v, h:hh}); });
    h+='<section class="sec"><div class="sec-h"><h2 class="eyebrow">Übungen</h2></div><div class="scroller" role="tablist">'+present.map(id=>'<button class="pchip'+(id===ex?' on':'')+'" data-a="prog-ex" data-ex="'+id+'" role="tab" aria-selected="'+(id===ex)+'">'+esc(EX[id].short||EX[id].name)+'</button>').join('')+'</div><div class="panel"><div><div style="font-weight:600">'+esc(def.name)+'</div><div class="muted" style="font-size:13px">'+mt.label+'</div></div>';
    if(byS.length) h+=lineChart(byS, mt.unit);
    if(def.load!=='reps' && def.equip!=='assist' && def.equip!=='bw'){
      let best=null; hist.forEach(hh=>hh.sets.forEach(x=>{ if(!best || (x.w||0)>best.w || ((x.w||0)===best.w && x.r>best.r)) best={w:x.w||0, r:x.r, d:hh.s.date}; }));
      const be=byS.reduce((a,p)=>p.y>a.y?p:a, byS[0]);
      if(best && be) h+='<div class="kv"><div class="stat"><b>'+fmtW(best.w)+' kg</b><span>Schwerster Satz · '+best.r+' Wdh. · '+fmtShort(best.d)+'</span></div><div class="stat"><b>'+fmtW(rnd(be.y))+' kg</b><span>Bestes e1RM · '+fmtShort(be.h.s.date)+'</span></div></div>';
    }
    h+='<table class="tbl"><tbody>'+hist.slice(-5).reverse().map(hh=>'<tr><td>'+fmtShort(hh.s.date)+'</td><td>'+esc(fmtSets(hh.sets, def, true))+'</td><td>'+(mt.unit==='kg'&&def.equip!=='assist'?fmtW(rnd(mt.fn(hh.sets))):fmtW(mt.fn(hh.sets)))+'</td></tr>').join('')+'</tbody></table></div></section>';
  }

  // Volumen
  const cw=weekVolume(ws0), avg={};
  for(let i=1;i<=4;i++){ const v=weekVolume(addDays(ws0,-7*i)); for(const k in v) avg[k]=(avg[k]||0)+v[k]/4; }
  const keys=Object.keys(MUSCLES).filter(k=>(cw[k]||0)>0 || (avg[k]||0)>0);
  if(keys.length){
    const max=Math.max(10, ...keys.map(k=>Math.max(cw[k]||0, avg[k]||0)));
    h+='<section class="sec"><div class="sec-h"><h2 class="eyebrow">Sätze pro Muskelgruppe</h2><button class="link" data-a="info-open">Wie gerechnet?</button></div><div class="panel"><div class="legend"><span><i style="width:14px;height:8px;border-radius:4px;background:var(--accent)"></i>Diese Woche</span><span><i style="width:2px;height:12px;background:var(--fg)"></i>Ø letzte 4 Wochen</span><span><i style="width:0;height:12px;border-left:1.5px dashed var(--line-strong)"></i>10 Sätze</span></div>';
    keys.forEach(k=>{ const c=cw[k]||0, a=avg[k]||0; h+='<div class="vrow"><span>'+MUSCLES[k]+'</span><span class="vtrack"><span class="vfill" style="width:'+(c/max*100).toFixed(1)+'%"></span><span class="vref" style="left:'+(10/max*100).toFixed(1)+'%"></span>'+(a>0?'<span class="vavg" style="left:calc('+(a/max*100).toFixed(1)+'% - 1px)"></span>':'')+'</span><span class="vnum">'+fmtW(rnd(c))+' <span class="muted" style="font-weight:500">/ '+fmtW(Math.round(a*10)/10)+'</span></span></div>'; });
    h+='<p class="muted" style="margin:0;font-size:13px">Indirekt beanspruchte Muskeln zählen halb. In der Polysport-Phase ist das Orientierung, kein Ziel.</p></div></section>';
  }
  return h;
}

function openSheet(type){ state.sheet=type; renderSheet(); }
function closeSheet(){ state.sheet=null; renderSheet(); }

function renderSheet(){
  const wrap=$('#sheet');
  if(!state.sheet){ wrap.hidden=true; wrap.innerHTML=''; return; }
  let h='';
  const t=state.sheet;
  if(t==='check') h=sheetCheck();
  else if(t==='finish') h=sheetFinish();
  else if(t==='confirm') h=sheetConfirm();
  else if(t==='info') h=sheetInfo();
  else if(t==='brief') h=sheetBrief();
  else if(t==='backlog') h=sheetBacklog();
  else if(t==='swap') h=sheetSwap();
  else if(t==='news') h=sheetNews();
  else if(t==='steps') h=sheetSteps();
  const prevScroll = wrap.firstElementChild ? wrap.firstElementChild.scrollTop : 0;
  wrap.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>'+h+'</div>';
  wrap.hidden=false;
  wrap.firstElementChild.scrollTop=prevScroll;
}

function swapUsedElsewhere(w){
  const used=new Set(), st=state.settings;
  if(w.mode==='session'){
    const cs=curSession(); if(!cs) return used;
    cs.blocks.forEach((b,bi)=>b.items.forEach((e,ii)=>{
      if(e.skipped || (bi===w.bi && ii===w.ii)) return;
      if(w.key && entryKey(cs,e)===w.key) return;
      used.add(e.ex);
    }));
  } else {
    ['A','B'].forEach(t=>{
      if(!planItemIn(t, w.key)) return;
      PLANS[t].blocks.forEach(b=>{
        if((b.opt==='arms' && !st.arms) || (b.opt==='nordicA' && !st.nordicA)) return;
        b.items.forEach(it=>{ if(it.key!==w.key) used.add(resolveEx(it)); });
      });
    });
  }
  return used;
}

function sheetSwap(){
  const w=state.swap, g=w && GROUPS[w.group]; if(!g) return '';
  const pit=planItemAny(w.key), orig=pit?pit.ex:null, planCur=pit?resolveEx(pit):null;
  const ch=swapChoices(w.group), used=swapUsedElsewhere(w), hidden=[];
  const keep=id=>{ if(id===w.cur || id===orig || !used.has(id)) return true; hidden.push(id); return false; };
  const same=ch.same.filter(keep), fams=ch.fams.map(f=>({label:f.label, ex:f.ex.filter(keep)})).filter(f=>f.ex.length);
  const opt=id=>{
    const def=EX[id], last=perfHistory(id, Infinity, null)[0];
    const tg=[]; if(id===orig) tg.push('<span class="chip">Original</span>'); if(id===w.cur) tg.push('<span class="chip acc">'+(w.mode==='settings'?'Im Plan':'Aktuell')+'</span>');
    return '<button class="opt'+(w.sel===id?' on':'')+'" role="radio" aria-checked="'+(w.sel===id)+'" data-a="sw-sel" data-v="'+id+'"><span class="radio"></span><span class="tx"><b>'+esc(def.name)+'</b><small>'+esc(gearOf(def))+' · '+(last?'zuletzt '+fmtShort(last.s.date)+': '+esc(fmtSets(last.sets,def,false)):'noch nie gemacht')+'</small></span>'+(tg.length?'<span class="chips">'+tg.join('')+'</span>':'')+'</button>';
  };
  let h='<h2 id="sh-t">Übung tauschen</h2><p class="lead">'+(w.mode==='settings'?'Gilt ab der nächsten Einheit. ':'')+'Gleiche Bewegung oder andere Übungen für dieselben Muskeln.</p>';
  if(g.note) h+='<div class="callout info">'+I.info+'<div>'+esc(g.note)+'</div></div>';
  h+='<div class="sw-sec"><h3 class="eyebrow" id="sw-h1">Gleiche Bewegung · '+esc(g.label)+'</h3><div class="opts" role="radiogroup" aria-labelledby="sw-h1">'+same.map(opt).join('')+'</div></div>';
  fams.forEach((f,fi)=>{ h+='<div class="sw-sec"><h3 class="eyebrow" id="sw-h'+(fi+2)+'">Andere Bewegung · '+esc(f.label)+'</h3><div class="opts" role="radiogroup" aria-labelledby="sw-h'+(fi+2)+'">'+f.ex.map(opt).join('')+'</div></div>'; });
  if(hidden.length) h+='<p class="sw-sub">Nicht aufgeführt, weil schon in der Einheit: '+esc(hidden.map(id=>EX[id].short||EX[id].name).join(', '))+'.</p>';
  if(w.mode==='session'){
    if(w.key) h+='<div class="q"><div class="q-l">Gilt für</div>'+segRow('sw-scope', [['once','Nur heute'],['always','Dauerhaft im Plan']], w.scope)+'</div>';
    if(w.doneN) h+='<p class="muted" style="margin:0;font-size:14px">'+(w.doneN===1?'Dein erledigter Satz bleibt':'Deine '+w.doneN+' erledigten Sätze bleiben')+' bei '+esc(EX[w.cur].name)+'. Die restlichen Sätze machst du mit der neuen Übung.</p>';
  }
  const can = w.sel!==w.cur || (w.mode==='session' && w.scope==='always' && !!w.key && planCur!==w.sel);
  h+='<button class="btn pri block" data-a="sw-go"'+(can?'':' disabled')+'>'+(w.mode==='settings'?'Im Plan speichern':'Tauschen')+'</button><button class="link" style="align-self:center" data-a="sheet-close">Abbrechen</button>';
  return h;
}

function sheetInfo(){

  +'<div><h3>RIR</h3><p>Wiederholungen in Reserve: wie viele saubere Wiederholungen noch drin gewesen wären. Grundübungen RIR 1–2, Ergänzungsübungen 1–3. Beim ersten Mal pro Übung (im Wiedereinstieg oder nach mehr als 4 Wochen Pause) 3–4, danach im Wiedereinstieg 2–3: Technik und Muskel gewöhnen sich so ohne grossen Muskelkater wieder an die Belastung.</p><cite>Helms et al. 2016, Strength & Conditioning Journal</cite></div>'
  +'<div><h3>Geschätztes 1RM</h3><p>Epley-Formel mit Reserve: Gewicht × (1 + (Wdh + RIR) / 30). Nur als Trend lesen, nicht als Maximalversuch.</p></div>'

  +'<div><h3>Supersätze</h3><p>Zwei Übungen für verschiedene Muskeln im Wechsel sparen Zeit, ohne die Leistung pro Satz merklich zu drücken.</p><cite>Robbins et al. 2010, J Strength Cond Res</cite></div>'
  +'<div><h3>Wochenvolumen</h3><p>Mehr harte Sätze pro Muskel und Woche bringen tendenziell mehr Muskelaufbau, ab etwa 10 Sätzen deutlich. Indirekte Beanspruchung zählt hier halb. In dieser Phase ist das nur Orientierung.</p><cite>Schoenfeld et al. 2017, J Sports Sci</cite></div>'

let actx=null, wakeLock=null;
function primeAudio(){ try{ if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); } if(actx && actx.state==='suspended') actx.resume(); }catch(e){} }
function beep(){
  try{
    if(!actx) return; const t0=actx.currentTime;
    [0,0.22,0.44].forEach((d,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=i===2?1175:880; g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.25,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.16); o.connect(g); g.connect(actx.destination); o.start(t0+d); o.stop(t0+d+0.18); });
  }catch(e){}
}
async function keepAwake(on){
  try{
    if(on){ if(!wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ wakeLock=null; }); } }
    else if(wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && state.view==='session' && !state.editId && activeSession()) keepAwake(true); });

const Timer = {
  t:null,
  start(sec, next){ this.t={endAt:Date.now()+sec*1000, dur:sec, next, ended:false}; this.save(); renderDock(); },
  add(d){ if(!this.t) return; if(this.t.ended){ this.t.endAt=Date.now()+d*1000; this.t.dur=d; this.t.ended=false; } else { this.t.endAt+=d*1000; this.t.dur+=d; } this.save(); renderDock(); },
  stop(){ this.t=null; this.save(); renderDock(); },
  save(){ try{ if(this.t) sessionStorage.setItem('gymlog.timer', JSON.stringify(this.t)); else sessionStorage.removeItem('gymlog.timer'); }catch(e){} },
  load(){ try{ const t=JSON.parse(sessionStorage.getItem('gymlog.timer')||'null'); if(t && t.endAt>Date.now()-60000) this.t=t; }catch(e){} },
  tick(){
    const el=$('#elapsed'); if(el){ const s=curSession(); if(s) el.textContent=fmtClock((Date.now()-s.startedAt)/1000); }
    if(!this.t || state.view!=='session') return;
    const left=(this.t.endAt-Date.now())/1000;
    if(left<=0 && !this.t.ended){
      this.t.ended=true; this.t.endedAt=Date.now(); this.save();
      if(state.settings.sound) beep();
      try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
      renderDock(); return;
    }
    if(this.t.ended){ if(Date.now()-this.t.endedAt>60000){ this.stop(); } return; }
    const box=$('#tmr'); if(!box) return;
    box.querySelector('.tmr-time').textContent=fmtClock(Math.ceil(left));
    box.querySelector('.tmr-bar i').style.transform='scaleX('+Math.max(0,Math.min(1,left/this.t.dur)).toFixed(3)+')';
  }
};
setInterval(()=>Timer.tick(), 250);

/* =========================================================
   Aktionen
   ========================================================= */
let toastTimer=null;
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'), 2800); }

function go(view){ state.view=view; state.delArm=false; if(view!=='session') keepAwake(false); render(); window.scrollTo(0,0); }

function persist(s){ Store.saveSession(s); }

function scrollToBlock(i){
  requestAnimationFrame(()=>{ const el=document.getElementById('blk-'+i); if(el){ const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; el.scrollIntoView({behavior:reduce?'auto':'smooth', block:'start'}); } });
}

function startSession(type, check, short){
  const s=buildSession(type, {check, short});
  state.cur[s.id] = s.warmup.length ? -1 : 0; saveUi();
  persist(s); state.editId=null; state.sheet=null; state.view='session';
  Timer.stop(); primeAudio(); keepAwake(true);
  render(); window.scrollTo(0,0);
}

function afterSetDone(s,bi,ii,si){
  const b=s.blocks[bi];
  if(b.ss){
    for(let k=ii+1;k<b.items.length;k++){
      const p=b.items[k]; if(p.skipped) continue;
      const pi=p.sets.findIndex(x=>!x.done);
      if(pi>-1 && pi<=si){ Timer.stop(); toast('Weiter mit '+(EX[p.ex].short||EX[p.ex].name)+', Satz '+(pi+1)); return; }
    }
  }
  const rest=restOf(b);
  if(blockDone(b)){
    const nb=nextOpenBlock(s,bi);
    if(nb<0){ Timer.stop(); toast('Alle Sätze erledigt. Stark!'); return; }
    const nx=s.blocks[nb].items.filter(e=>!e.skipped).map(e=>EX[e.ex].short||EX[e.ex].name).join(' + ');
    Timer.start(rest, nx);
    // Fehlt noch eine RIR, bleibt der Block offen. Gewechselt wird, sobald sie eingetragen ist (siehe advanceIfReady).
    if(missingRir(b)) return;
    setCur(s, nb);
    scrollToBlock(nb);
    return;
  }
  let label='';
  for(const e of b.items){ if(e.skipped) continue; const i=e.sets.findIndex(x=>!x.done); if(i>-1){ label=(EX[e.ex].short||EX[e.ex].name)+', Satz '+(i+1); break; } }
  Timer.start(rest, label);
}

function nextOpenBlock(s,bi){
  for(let k=bi+1;k<s.blocks.length;k++){ if(!blockDone(s.blocks[k])) return k; }
  for(let k=0;k<bi;k++){ if(!blockDone(s.blocks[k])) return k; }
  return -1;
}
// Wechselt zum nächsten offenen Block, wenn der aktuelle fertig ist und keine RIR mehr fehlt.
// Kurze Verzögerung, damit die gewählte RIR sichtbar wird, bevor der Block zuklappt.
let advTimer=null;
function advanceIfReady(s,bi,delay){
  clearTimeout(advTimer);
  advTimer=setTimeout(()=>{
    const cs=curSession();
    if(!cs || cs.id!==s.id || state.editId || state.view!=='session') return;
    const b=cs.blocks[bi];
    if(!b || curBlock(cs)!==bi || !blockDone(b) || missingRir(b)) return;
    const nb=nextOpenBlock(cs,bi); if(nb<0) return;
    setCur(cs, nb);
    if(Timer.t && !Timer.t.ended){ Timer.t.next=cs.blocks[nb].items.filter(e=>!e.skipped).map(e=>EX[e.ex].short||EX[e.ex].name).join(' + '); Timer.save(); }
    renderMain(); renderDock(); scrollToBlock(nb);
  }, delay==null?450:delay);
}

function updatePlates(s,bi,ii){
  const el=document.getElementById('pl-'+bi+'-'+ii); if(!el) return;
  const e=s.blocks[bi].items[ii], fo=e.sets.findIndex(x=>!x.done);
  const w = fo>-1 ? e.sets[fo].w : e.sets[e.sets.length-1].w;
  el.innerHTML = plateHtml(w, EX[e.ex]);
}

function propagateWeight(s,bi,ii,si,oldV,newV){
  const e=s.blocks[bi].items[ii];
  for(let j=si+1;j<e.sets.length;j++){
    const x=e.sets[j];
    if(!x.done && x.w===oldV){ x.w=newV; const inp=document.getElementById('in-w-'+bi+'-'+ii+'-'+j); if(inp){ inp.value=newV==null?'':fmtW(newV); inp.dataset.old=newV==null?'':newV; } }
  }
}

function onClick(ev){
  const wrap=$('#sheet');
  if(ev.target===wrap){ if(state.sheet!=='finish') closeSheet(); return; }
  const el=ev.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, d=el.dataset;
  const bi=d.b!=null?+d.b:null, ii=d.i!=null?+d.i:null, si=d.s!=null?+d.s:null;
  const s = (state.view==='session') ? curSession() : null;

  switch(a){
    case 'tab': state.editId=null; go(d.v); break;
    case 'sync-info': {
      const st=Store.status()[0];
      if(Store.mode==='db' && st==='err'){ toast('Speichern klappt gerade nicht. Deine Daten bleiben auf dem iPhone, ich versuche es nochmals.'); Store.error=null; Store.flush(); Store.pull(true); }
      else if(st==='local') toast('Kein Netz. Deine Einträge bleiben auf dem iPhone und werden automatisch hochgeladen.');
      else if(st==='busy') toast('Wird gerade gespeichert.');
      else if(Store.mode==='db') toast('Alles in deiner Datenbank gespeichert.');
      else if(Store.mode==='signedout') toast('Melde dich an, damit gespeichert wird.');
      else toast('Verbindung wird aufgebaut.');
      break;
    }
    case 'logout': {
      const n=Store.pendingCount();
      state.confirm={title:'Abmelden?', text: n ? 'Auf diesem iPhone sind noch Änderungen, die nicht hochgeladen sind. Beim Abmelden gehen sie verloren.' : 'Deine Einheiten bleiben in der Datenbank. Auf diesem iPhone wird die lokale Kopie gelöscht.', ok:'Abmelden', fn:()=>Store.signOut()};
      openSheet('confirm'); break;
    }

    case 'start': {
      if(activeSession()){ toast('Es läuft schon eine Einheit.'); break; }
      state.check={type:d.t, energy:null, sore:[], pain:[], intense:null, short:false, shortTouched:false};
      openSheet('check'); break;
    }
    case 'ck-energy': { const c=state.check; c.energy=+d.v; if(!c.shortTouched && c.type!=='H') c.short = c.energy===0; renderSheet(); break; }
    case 'ck-sore': case 'ck-pain': { const key=a==='ck-sore'?'sore':'pain', other=a==='ck-sore'?'pain':'sore', c=state.check; const i=c[key].indexOf(d.v); if(i>-1) c[key].splice(i,1); else { c[key].push(d.v); const j=c[other].indexOf(d.v); if(j>-1) c[other].splice(j,1); } renderSheet(); break; }
    case 'ck-intense': state.check.intense=d.v==='1'; renderSheet(); break;
    case 'ck-go': { const c=state.check; const chk={energy:c.energy==null?1:c.energy, sore:c.sore.slice(), pain:c.pain.slice(), intense:!!c.intense}; startSession(c.type, chk, c.short); break; }
    case 'ck-skip': startSession(state.check.type, null, false); break;

    case 'resume': state.editId=null; state.view='session'; keepAwake(true); render(); window.scrollTo(0,0); scrollToBlock(curBlock(activeSession())); break;
    case 'discard': {
      const act=activeSession(); if(!act) break;
      state.confirm={title:'Einheit verwerfen?', text:'Alle Sätze dieser Einheit werden gelöscht. Das lässt sich nicht rückgängig machen.', ok:'Verwerfen', fn:()=>{ Store.deleteSession(act.id); Timer.stop(); keepAwake(false); state.view='home'; }};
      openSheet('confirm'); break;
    }
    case 'confirm-ok': { const fn=state.confirm&&state.confirm.fn; state.sheet=null; if(fn) fn(); render(); break; }
    case 'sheet-close': closeSheet(); break;

    case 'sess-back': go('home'); break;
    case 'sess-finish': { state.finish={feel:null, fun:null, note:(s&&s.note)||''}; openSheet('finish'); break; }
    case 'fin-feel': state.finish.feel=+d.v; renderSheet(); break;
    case 'fin-fun': state.finish.fun=+d.v; renderSheet(); break;
    case 'fin-save': {
      const cs=curSession(); if(!cs) break;
      const [dn]=totalSets(cs);
      if(dn===0){ toast('Noch kein Satz abgehakt. Zum Verwerfen in der Übersicht «Einheit verwerfen» wählen.'); break; }
      cs.status='done'; cs.endedAt=Date.now(); cs.feel=state.finish.feel; cs.fun=state.finish.fun; cs.note=(state.finish.note||'').trim();
      persist(cs); Timer.stop(); keepAwake(false);
      const prs=sessionPRs(cs);
      state.sheet=null; state.detailId=cs.id; state.view='detail'; render(); window.scrollTo(0,0);
      toast(prs.length ? 'Gespeichert. '+prs.length+(prs.length===1?' neuer Bestwert!':' neue Bestwerte!') : 'Gespeichert. Gute Einheit!');
      break;
    }

    case 'warm': { s.warmup[ii]=!s.warmup[ii]; persist(s); if(s.warmup.every(Boolean)){ setCur(s,0); renderMain(); renderDock(); renderTop(); scrollToBlock(0); } else renderMain(); break; }
    case 'warm-all': { s.warmup=s.warmup.map(()=>true); persist(s); setCur(s,0); render(); scrollToBlock(0); break; }
    case 'block-open': setCur(s, bi); render(); scrollToBlock(bi); break;
    case 'nav': { const c=curBlock(s), min=s.warmup.length?-1:0; const n=Math.max(min, Math.min(s.blocks.length-1, c+(+d.d))); if(n!==c){ setCur(s,n); render(); scrollToBlock(n); } break; }

    case 'step': {
      if(d.f==='fw' || d.f==='fr'){
        const e=s.blocks[bi].items[ii], def=EX[e.ex], fd=e.find; if(!fd) break;
        if(d.f==='fw'){ const inc=incFor(def, state.settings); fd.w=snapW(Math.max(0, rnd((fd.w==null?(FIND_START[e.ex]||0):fd.w)+(+d.d)*inc)), def); const inp=document.getElementById('in-fw-'+bi+'-'+ii+'-0'); if(inp){ inp.value=fmtW(fd.w); } const pl=document.getElementById('pl-'+bi+'-'+ii); if(pl) pl.innerHTML=plateHtml(fd.w, def); }
        else { fd.r=Math.max(1, (fd.r==null?e.target.reps[0]:fd.r)+(+d.d)); const inp=document.getElementById('in-fr-'+bi+'-'+ii+'-0'); if(inp) inp.value=fd.r; }
        persist(s); break;
      }
      const e=s.blocks[bi].items[ii], x=e.sets[si], def=EX[e.ex], f=d.f;
      if(f==='w'){
        const inc=incFor(def, state.settings), old=x.w;
        let v = (x.w==null ? (e.target.w!=null?e.target.w:(def.equip==='bb'?+state.settings.barKg:0)) : x.w) + (+d.d)*inc;
        if(x.w==null && +d.d>0 && e.target.w==null) v = def.equip==='bb'?+state.settings.barKg:inc;
        x.w=snapW(Math.max(0, rnd(v)), def);
        const inp=document.getElementById('in-w-'+bi+'-'+ii+'-'+si); if(inp){ inp.value=fmtW(x.w); inp.dataset.old=x.w; }
        if(!x.done) propagateWeight(s,bi,ii,si,old,x.w);
        updatePlates(s,bi,ii);
      } else {
        x.r=Math.max(0, (x.r==null?(e.target.perSet[si]||e.target.reps[0]):x.r) + (+d.d));
        const inp=document.getElementById('in-r-'+bi+'-'+ii+'-'+si); if(inp) inp.value=x.r;
      }
      persist(s); break;
    }
    case 'done': {
      const e=s.blocks[bi].items[ii], x=e.sets[si], def=EX[e.ex];
      if(!x.done){
        if(def.load!=='reps' && x.w==null){
          if(def.equip==='bw' || def.zero) x.w=0;
          else { toast('Bitte zuerst das Gewicht eintragen.'); const inp=document.getElementById('in-w-'+bi+'-'+ii+'-'+si); if(inp) inp.focus(); break; }
        }
        if(x.r==null || x.r===0){ if(x.r==null) x.r=e.target.perSet[si]||e.target.reps[0]; }
        x.done=true; x.t=Date.now();
        primeAudio();
        persist(s);
        if(!state.editId) afterSetDone(s,bi,ii,si);
      } else { x.done=false; x.rir=null; delete x.t; persist(s); }
      renderMain(); renderTop(); renderDock();
      break;
    }
    case 'rir': { const b=s.blocks[bi], x=b.items[ii].sets[si]; const v=+d.v; const miss=missingRir(b); x.rir = x.rir===v ? null : v; persist(s); renderMain(); renderDock(); if(miss && x.rir!=null && !state.editId) advanceIfReady(s,bi); break; }
    case 'fd-rate': {
      const e=s.blocks[bi].items[ii], def=EX[e.ex];
      const res=findRate(s, bi, ii, d.v);
      if(res==='found') toast('Arbeitsgewicht gefunden: '+fmtLoad(e.find.result, def));
      else if(res==='done' && !e.find.suggestAssist) toast('Arbeitsgewicht: '+fmtLoad(e.find.result, def)+(e.find.reps?' × '+e.find.reps:''));
      renderMain(); renderTop(); renderDock();
      const card=document.getElementById(res==='next'?'find-'+bi+'-'+ii:'ex-'+bi+'-'+ii); if(card && res==='next') card.scrollIntoView({block:'nearest'});
      break;
    }
    case 'fd-undo': { findUndo(s, bi, ii); Timer.stop(); renderMain(); renderTop(); renderDock(); break; }
    case 'fd-skip': { const e=s.blocks[bi].items[ii]; e.find.status='skipped'; e.target.action='new'; e.target.reason='Arbeitsgewicht selbst eintragen.'; persist(s); renderMain(); break; }
    case 'fd-start': { const e=s.blocks[bi].items[ii], def=EX[e.ex]; const w0=e.sets.find(x=>x.w!=null); const start = w0 ? w0.w : (e.target.w!=null ? e.target.w : (FIND_START[e.ex]!=null?FIND_START[e.ex]:findMinW(def))); findBegin(e, s.reentry, start, 'Von dir gestartet.', true); persist(s); renderMain(); renderTop(); break; }
    case 'fd-assist': { swapEntry(s, bi, ii, 'pullupA', 'once'); persist(s); render(); toast('Heute Klimmzüge assistiert'); break; }
    case 'rir-fix': { const cs=curSession(); if(!cs) break; const i=cs.blocks.findIndex(b=>missingRir(b)>0); state.sheet=null; if(i>-1) setCur(cs,i); render(); if(i>-1) scrollToBlock(i); break; }
    case 'steps-open': { const e=s.blocks[bi].items[ii]; state.stepsRef={ex:e.ex}; openSheet('steps'); break; }
    case 'steps-save': case 'steps-reset': {
      const r=state.stepsRef; if(!r) break; const st=state.settings; st.steps=st.steps||{};
      if(a==='steps-reset') delete st.steps[r.ex];
      else {
        const num=id=>{ const v=parseFloat(String(document.getElementById(id).value).replace(',','.')); return isNaN(v)?null:v; };
        const inc=num('st-inc'), min=num('st-min')||0, max=num('st-max')||0, err=document.getElementById('st-err');
        if(!(inc>0)){ err.textContent='Bitte einen Schritt grösser als 0 eintragen.'; break; }
        if(min<0 || (max>0 && max<=min)){ err.textContent='Das grösste Gewicht muss über dem kleinsten liegen.'; break; }
        st.steps[r.ex]={inc:rnd(inc), min:rnd(min), max:rnd(max)};
      }
      Store.saveSettings(); closeSheet(); renderMain();
      toast(st.steps[r.ex] ? 'Schritte gespeichert: '+gridText(st.steps[r.ex]) : 'Standard-Schritte gelten wieder.'); break;
    }
    case 'swap-open': {
      const e=s.blocks[bi].items[ii], g=entryGroup(e); if(!g || !GROUPS[g]) break;
      state.swap={mode:'session', bi, ii, key:entryKey(s,e), group:g, cur:e.ex, sel:e.ex, scope:'once', doneN:e.sets.filter(x=>x.done).length};
      openSheet('swap'); break;
    }
    case 'plan-swap': { const it=planItemAny(d.k); if(!it) break; const cur=resolveEx(it); state.swap={mode:'settings', key:d.k, group:it.group, cur, sel:cur}; openSheet('swap'); break; }
    case 'sw-sel': state.swap.sel=d.v; renderSheet(); break;
    case 'sw-scope': state.swap.scope=d.v; renderSheet(); break;
    case 'sw-go': {
      const w=state.swap; if(!w) break;
      if(w.mode==='settings'){ setSwap(w.key, w.sel); state.sheet=null; render(); toast(EX[w.sel].name+' ist jetzt im Plan'); break; }
      const cs=curSession(); if(!cs) break;
      const from=w.cur;
      if(w.sel!==from) swapEntry(cs, w.bi, w.ii, w.sel, w.scope);
      if(w.scope==='always' && w.key) setSwap(w.key, w.sel);
      persist(cs); state.sheet=null; render();
      toast(w.sel===from ? EX[w.sel].name+' ist jetzt im Plan' : (w.scope==='always' ? EX[w.sel].name+' ersetzt '+EX[from].name+' im Plan' : 'Heute '+EX[w.sel].name+' statt '+EX[from].name));
      break;
    }
    case 'add-set': { const e=s.blocks[bi].items[ii]; const l=e.sets[e.sets.length-1]||{w:e.target.w,r:e.target.reps[0]}; e.sets.push({w:l.w, r:l.r, rir:null, done:false}); persist(s); renderMain(); renderTop(); break; }
    case 'rm-set': { const e=s.blocks[bi].items[ii]; if(e.sets.length>1 && !e.sets[e.sets.length-1].done){ e.sets.pop(); persist(s); renderMain(); renderTop(); if(!state.editId && blockDone(s.blocks[bi])) advanceIfReady(s,bi); } break; }
    case 'skip': { const e=s.blocks[bi].items[ii]; e.skipped=true; e.skipWhy='von dir ausgelassen'; persist(s); if(blockDone(s.blocks[bi]) && !state.editId){ afterSetDoneSkip(s,bi); } renderMain(); renderTop(); renderDock(); break; }
    case 'unskip': { const e=s.blocks[bi].items[ii]; e.skipped=false; delete e.skipWhy; persist(s); setCur(s,bi); renderMain(); renderTop(); renderDock(); break; }
    case 'ed-feel': if(s){ s.feel = s.feel===+d.v ? null : +d.v; persist(s); renderMain(); } break;
    case 'ed-fun': if(s){ s.fun = s.fun===+d.v ? null : +d.v; persist(s); renderMain(); } break;
    case 'tmr-add': Timer.add(+d.d); break;
    case 'tmr-stop': Timer.stop(); break;

    case 'edit-done': {
      const es=state.sessions[state.editId]; if(!es) { go('history'); break; }
      if(es.status==='backlog'){ if(!totalSets(es)[0]){ toast('Hake mindestens einen Satz ab oder tippe auf Zurück zum Verwerfen.'); break; } es.status='done'; persist(es); }
      state.detailId=es.id; state.editId=null; go('detail'); toast('Gespeichert');
      break;
    }
    case 'edit-cancel': {
      const es=state.sessions[state.editId];
      if(es && es.status==='backlog'){ Store.deleteSession(es.id); state.editId=null; go('history'); }
      else { state.detailId=state.editId; state.editId=null; go('detail'); }
      break;
    }

    case 'open-detail': state.detailId=d.id; go('detail'); break;
    case 'detail-edit': { const ds=state.sessions[state.detailId]; if(!ds) break; state.editId=ds.id; state.view='session'; state.cur[ds.id]=0; render(); window.scrollTo(0,0); break; }
    case 'detail-del': state.delArm=true; renderMain(); break;
    case 'detail-del-cancel': state.delArm=false; renderMain(); break;
    case 'detail-del-ok': { Store.deleteSession(state.detailId); state.detailId=null; go('history'); toast('Einheit gelöscht'); break; }

    case 'prog-ex': state.progEx=d.ex; renderMain(); break;


    case 'brief-open': state.briefWeek=0; openSheet('brief'); break;
    case 'brief-week': state.briefWeek=+d.v; renderSheet(); break;
    case 'brief-copy': {
      const ta=$('#brief-txt'); const txt=ta?ta.value:'';
      const fallback=()=>{ if(ta){ ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); } toast('Text markiert. Jetzt kopieren.'); };
      try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'), fallback); else fallback(); }catch(e){ fallback(); }
      break;
    }
    case 'csv': exportCsv(); break;
    case 'info-open': openSheet('info'); break;
    case 'news-open': state.newsAll=true; openSheet('news'); break;
    case 'news-all': state.newsAll=true; renderSheet(); break;

    case 'backlog-open': state.backlog={type:nextType(), date:addDays(todayStr(),-1)}; openSheet('backlog'); break;
    case 'bl-type': state.backlog.type=d.v; renderSheet(); break;
    case 'bl-go': {
      const b=state.backlog; if(!b.date || b.date>todayStr()){ toast('Bitte ein Datum bis heute wählen.'); break; }
      const ns=buildSession(b.type, {date:b.date, backlog:true});
      persist(ns); state.editId=ns.id; state.cur[ns.id]=0; state.sheet=null; state.view='session'; render(); window.scrollTo(0,0);
      break;
    }
  }
}

function afterSetDoneSkip(s,bi){
  let nb=-1; for(let k=bi+1;k<s.blocks.length;k++){ if(!blockDone(s.blocks[k])){ nb=k; break; } }
  if(nb>-1){ setCur(s,nb); scrollToBlock(nb); }
}

async function exportCsv(){
  if(!doneSessions().length){ toast('Noch keine Einheit zum Exportieren.'); return; }
  const name='gym-logbuch-'+todayStr()+'.csv';
  const blob=new Blob(['\ufeff'+csvText()], {type:'text/csv'});
  try{
    const file=new File([blob], name, {type:'text/csv'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Gym-Logbuch'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast('Export hier nicht möglich.'); }
}

function onInput(ev){
  const el=ev.target, f=el.dataset.f;
  if(f==='w' || f==='r'){
    const s=curSession(); if(!s) return;
    const bi=+el.dataset.b, ii=+el.dataset.i, si=+el.dataset.s;
    const x=s.blocks[bi].items[ii].sets[si];
    let v=parseNum(el.value);
    if(f==='r' && v!=null) v=Math.max(0, Math.round(v));
    if(v!=null && v<0) v=0;
    x[f]=v;
    persist(s);
    if(f==='w') updatePlates(s,bi,ii);
  } else if(f==='fw' || f==='fr'){
    const s=curSession(); if(!s) return;
    const e=s.blocks[+el.dataset.b].items[+el.dataset.i], fd=e.find; if(!fd) return;
    let v=parseNum(el.value); if(v!=null && v<0) v=0;
    if(f==='fw'){ fd.w=v; const pl=document.getElementById('pl-'+el.dataset.b+'-'+el.dataset.i); if(pl) pl.innerHTML=plateHtml(v, EX[e.ex]); }
    else fd.r = v==null ? null : Math.max(1, Math.round(v));
    persist(s);
  } else if(f==='fin-note'){ state.finish.note=el.value; }
  else if(f==='ed-note'){ const s=curSession(); if(s){ s.note=el.value; persist(s); } }
}

function onChange(ev){
  const el=ev.target, f=el.dataset.f;
  if(f==='w'){
    const s=curSession(); if(!s) return;
    const bi=+el.dataset.b, ii=+el.dataset.i, si=+el.dataset.s;
    const x=s.blocks[bi].items[ii].sets[si];
    const old = el.dataset.old==='' ? null : parseNum(el.dataset.old);
    if(!x.done && old!==x.w) propagateWeight(s,bi,ii,si,old,x.w);
    el.dataset.old = x.w==null?'':x.w;
    el.value = x.w==null?'':fmtW(x.w);
    persist(s);
    return;
  }
  if(f==='r' || f==='fin-note' || f==='ed-note' || f==='fr') return;
  if(f==='fw'){ const s=curSession(); if(!s) return; const fd=s.blocks[+el.dataset.b].items[+el.dataset.i].find; if(fd) el.value=fd.w==null?'':fmtW(fd.w); return; }
  if(f==='ck-short'){ state.check.short=el.checked; state.check.shortTouched=true; return; }
  if(f==='bl-date'){ state.backlog.date=el.value; return; }
  if(f==='ed-date'){
    const s=curSession(); if(!s || !el.value) return;
    const t=new Date(s.startedAt), nd=parseYmd(el.value); nd.setHours(t.getHours(), t.getMinutes(), 0, 0);
    const delta = nd.getTime()-s.startedAt;
    s.date=el.value; s.startedAt=nd.getTime(); if(s.endedAt) s.endedAt+=delta;
    persist(s); renderTop(); return;
  }
  const path=el.dataset.s;
  if(path){
    const t=el.dataset.t; let v;
    if(t==='bool') v=el.checked;
    else if(t==='date') v=el.value||null;
    else { v=parseNum(el.value); }
    const parts=path.split('.');
    if(parts.length===2){
      if(parts[0]==='rest'){ if(v==null||v<10){ toast('Pause bitte in Sekunden, mindestens 10.'); renderMain(); return; } v=Math.round(v); }
      if(v==null) delete state.settings[parts[0]][parts[1]]; else state.settings[parts[0]][parts[1]]=v;
    } else {
      if(t==='num' && ['barKg','incBB','incDB','incCable','incAssist'].includes(path) && (v==null || v<=0)){ toast('Bitte einen Wert grösser als 0 eintragen.'); renderMain(); return; }
      state.settings[path]=v;
    }
    Store.saveSettings();
    if(t!=='num') renderMain();
  }
}

document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('submit', onLoginSubmit);
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && state.sheet && state.sheet!=='finish'){ closeSheet(); }
  if(ev.key==='Enter' && ev.target.matches && ev.target.matches('.num input, .sinput')){ ev.target.blur(); }
});
document.addEventListener('focusin', ev=>{ if(ev.target.matches && ev.target.matches('.num input')){ setTimeout(()=>{ try{ ev.target.select(); }catch(e){} }, 0); } });
window.addEventListener('scroll', ()=>{ const t=$('#top'); if(t) t.classList.toggle('scrolled', window.scrollY>4); }, {passive:true});
if(window.ResizeObserver) new ResizeObserver(measureDock).observe($('#dock'));
window.addEventListener('online', ()=>{ Store.onOnline(); renderSync(); });
window.addEventListener('offline', ()=>renderSync());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') Store.onVisible(); });

/* =========================================================
   Start
   ========================================================= */
Store.loadCache();
Timer.load();
if(!Store.cacheUid) state.view='login';
else if(activeSession()) state.view='session';
render();
Store.init();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
})();
</script>
