<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Gym-Logbuch</title>
<meta name="description" content="Persönliches Trainingslogbuch für Einheit A/B mit Progressionsvorschlägen.">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icons/icon-192-v2.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}

/* Layout: einspaltige App (max. 560px), Sticky-Kopf, fester Dock unten (Tabs oder Pausen-Timer + Übungsnavigation).
   Farben: Kreide-Grau als Grund, Graphit als Text, Hantelscheiben-Blau als Akzent; Scheibenfarben (IWF) nur als Daten. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --raised:#F6F8FA; --sunken:#E1E6EC;
  --fg:#12161B; --muted:#55606D; --faint:#8893A0; --line:#D3DAE2; --line-strong:#B6C0CB;
  --accent:#1556D4; --accent-ink:#FFFFFF; --accent-soft:#DDE7FA;
  --ok:#137A48; --ok-ink:#FFFFFF; --ok-soft:#D9EFE2;
  --warn:#8F5600; --warn-soft:#FBEACB; --bad:#B42F28; --bad-soft:#F7DDDA;
  --plate-a:#1F5ED1; --plate-a-ink:#FFFFFF; --plate-b:#E2AE0B; --plate-b-ink:#1B1500; --plate-h:#1E8C50; --plate-h-ink:#FFFFFF;
  --p25:#CC2E2E; --p20:#1F5ED1; --p15:#E2AE0B; --p10:#1E8C50; --p5:#F2F3F5; --psm:#3A414A; --p-ink-dark:#15191E; --p-ink-light:#FFFFFF;
  --shadow:0 1px 2px rgba(18,24,32,.06),0 6px 20px rgba(18,24,32,.07);
  --scrim:rgba(10,14,20,.45);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-m:12px; --r-l:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#171B20; --raised:#1D2228; --sunken:#262C34;
  --fg:#ECEFF3; --muted:#9CA6B2; --faint:#6E7986; --line:#2A3139; --line-strong:#3B444F;
  --accent:#73A0FF; --accent-ink:#08132B; --accent-soft:#1A2948;
  --ok:#4CC88A; --ok-ink:#06150D; --ok-soft:#13301F;
  --warn:#F0B04A; --warn-soft:#33260F; --bad:#FF7B70; --bad-soft:#3A1715;
  --plate-a:#2D6BE0; --plate-a-ink:#FFFFFF; --plate-b:#E2AE0B; --plate-b-ink:#1B1500; --plate-h:#23A05D; --plate-h-ink:#FFFFFF;
  --p25:#D93A3A; --p20:#2D6BE0; --p15:#E2AE0B; --p10:#23A05D; --p5:#D7DADF; --psm:#5A636E; --p-ink-dark:#15191E; --p-ink-light:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#171B20; --raised:#1D2228; --sunken:#262C34;
  --fg:#ECEFF3; --muted:#9CA6B2; --faint:#6E7986; --line:#2A3139; --line-strong:#3B444F;
  --accent:#73A0FF; --accent-ink:#08132B; --accent-soft:#1A2948;
  --ok:#4CC88A; --ok-ink:#06150D; --ok-soft:#13301F;
  --warn:#F0B04A; --warn-soft:#33260F; --bad:#FF7B70; --bad-soft:#3A1715;
  --plate-a:#2D6BE0; --plate-a-ink:#FFFFFF; --plate-b:#E2AE0B; --plate-b-ink:#1B1500; --plate-h:#23A05D; --plate-h-ink:#FFFFFF;
  --p25:#D93A3A; --p20:#2D6BE0; --p15:#E2AE0B; --p10:#23A05D; --p5:#D7DADF; --psm:#5A636E; --p-ink-dark:#15191E; --p-ink-light:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
h2,h3{text-wrap:balance}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;padding-block:8px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 27px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:3px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--ok)} .sync.busy i,.sync.local i{background:var(--warn)} .sync.err i{background:var(--bad)}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--fg)}
.icon-btn svg{width:22px;height:22px}

main{padding-bottom:calc(var(--dock-h,84px) + 28px)}
.stack{display:flex;flex-direction:column;gap:22px;padding-block:6px 0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-h .link{font-size:14px}

/* Bausteine */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font:600 19px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--sunken);color:var(--fg)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:16px;border-radius:11px}
.btn.block{width:100%}
.btn:active,.icon-btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:600;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
.row-btns{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunken);font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--surface);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--warn-soft);font-size:15px;line-height:1.4}
.callout.info{background:var(--accent-soft)}
.callout b{font-weight:600}
.callout svg{flex:none;width:20px;height:20px;margin-top:1px}
.empty{padding:22px 16px;border-radius:var(--r-l);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);font-size:15px;text-align:center;line-height:1.5}

/* Hantelscheibe als Einheiten-Abzeichen */
.plate{--pc:var(--plate-a);--pi:var(--plate-a-ink);flex:none;width:56px;height:56px;border-radius:50%;background:var(--pc);color:var(--pi);display:grid;place-items:center;font:700 28px/1 var(--f-display);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--pc) 72%,black),inset 0 0 0 7px var(--pc),inset 0 0 0 8px color-mix(in srgb,var(--pc) 62%,white)}
.plate.b{--pc:var(--plate-b);--pi:var(--plate-b-ink)}
.plate.h{--pc:var(--plate-h);--pi:var(--plate-h-ink)}
.plate.sm{width:38px;height:38px;font-size:19px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--pc) 72%,black),inset 0 0 0 5px var(--pc),inset 0 0 0 6px color-mix(in srgb,var(--pc) 62%,white)}
.plate.xs{width:26px;height:26px;font-size:14px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--pc) 72%,black)}

/* Startseite */
.phase{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.phase-t{font-size:15px;color:var(--muted);line-height:1.4;margin:0}
.hero{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;gap:14px;align-items:center}
.hero h2{margin:0;font:700 31px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.hero-sub{font-size:14px;color:var(--muted);margin-top:4px}
.plan-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plan-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.plan-row .no{font:700 15px/1 var(--f-display);color:var(--faint)}
.plan-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-row .tg{font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.plan-row .tg .up{color:var(--ok)}
.plan-row.skip{color:var(--faint)}
.alt{display:flex;flex-wrap:wrap;gap:4px 18px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted)}
.day.today{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.day .slot{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-strong);display:grid;place-items:center}
.day .slot.multi{position:relative}
.list{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line);min-height:62px}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .t1{font-weight:600}
.li .t2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--faint);flex:none}
.score{font:600 15px/1 var(--f-display);color:var(--muted);white-space:nowrap}

/* Einheit */
.blk-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border-radius:var(--r-m);min-height:58px}
.blk-no{flex:none;min-width:42px;height:32px;padding:0 8px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font:700 17px/1 var(--f-display);white-space:nowrap}
.blk-row.done .blk-no{background:var(--ok-soft);color:var(--ok)}
.blk-row.skipped{opacity:.55}
.blk-row.warn .blk-no{background:var(--warn-soft);color:var(--warn)}
.miss{flex:none;display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font:600 13px/1 var(--f-body);white-space:nowrap}
.blk-names{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk-prog{font:600 15px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.blk{display:flex;flex-direction:column;gap:10px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 74px)}
.blk-head{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:0 2px}
.blk-head .blk-no{background:var(--fg);color:var(--bg)}
.ex{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex.is-skipped{box-shadow:none;background:transparent;border:1.5px dashed var(--line-strong);padding:12px 14px;flex-direction:row;align-items:center;gap:12px}
.ex.is-skipped .tx{flex:1;min-width:0}
.ex-head{padding:0 2px;display:flex;gap:10px;align-items:flex-start}
.ex-head .tx{flex:1;min-width:0}
.swap-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
.swap-btn svg{width:18px;height:18px}
.ex-head h3{margin:0;font:700 23px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.ex-meta{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.35}
.ex-tag{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.vseg{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:11px}
.vseg button{flex:1 1 0;min-width:0;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;text-align:center}
.vseg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sugg{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--raised)}
.tag{flex:none;font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--sunken);color:var(--fg);margin-top:1px}
.tag.up{background:var(--ok-soft);color:var(--ok)} .tag.down{background:var(--warn-soft);color:var(--warn)} .tag.new,.tag.start{background:var(--accent-soft);color:var(--accent)}
.sugg .note{display:block;color:var(--warn);margin-top:3px}
.aux{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);padding:0 2px}
.aux-row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.pl{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;font:700 13px/1 var(--f-display);color:var(--p-ink-light);font-variant-numeric:tabular-nums}
.pl.p25{background:var(--p25)} .pl.p20{background:var(--p20)} .pl.p15{background:var(--p15);color:var(--p-ink-dark)} .pl.p10{background:var(--p10)}
.pl.p5{background:var(--p5);color:var(--p-ink-dark);box-shadow:inset 0 0 0 1px var(--line-strong)} .pl.psm{background:var(--psm)}
.sets{display:flex;flex-direction:column;gap:6px}
.set-h,.set{display:grid;grid-template-columns:36px minmax(0,1.15fr) minmax(0,.85fr) 48px;gap:8px;align-items:center}
.ro .set-h,.ro .set{grid-template-columns:36px minmax(0,1fr) 48px}
.set-h{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.set-h span{text-align:center}
.set-n{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.set-n b{font:700 19px/1 var(--f-display)}
.set-n small{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{display:flex;height:50px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;min-width:0}
.num button{flex:none;width:34px;font-size:24px;line-height:1;color:var(--muted);display:grid;place-items:center}
.num button:active{background:var(--sunken)}
.num input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font:600 24px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:0;outline-offset:-2px}
.num input::placeholder{color:var(--faint);font-weight:500;font-size:17px}
.set.is-next .num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.set.is-done .num{background:var(--ok-soft);box-shadow:none}
.chk{width:48px;height:50px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line-strong);color:var(--faint)}
.chk svg{width:26px;height:26px}
.set.is-next .chk{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.set.is-done .chk{background:var(--ok);color:var(--ok-ink);box-shadow:none}
.rir{display:flex;align-items:center;gap:5px;margin-left:44px;flex-wrap:wrap;margin-top:-1px}
.rir-l{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-right:3px}
.rir-cs{display:flex;gap:5px}
.rir-c{min-width:38px;height:34px;border-radius:9px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font:600 17px/1 var(--f-display);text-align:center}
.rir-c.tgt{box-shadow:inset 0 0 0 1px var(--line-strong),inset 0 -3px 0 var(--accent)}
.rir-c.on{background:var(--fg);color:var(--bg);box-shadow:none}
.rir.ask{padding:10px;border-radius:12px;background:var(--warn-soft);gap:8px}
.rir.ask .rir-l{flex-basis:100%;margin:0;font-size:14px;letter-spacing:0;color:var(--warn);font-weight:600;line-height:1.3}
.rir.ask .rir-c{background:var(--surface);min-width:42px;height:40px}
.rir.ask .rir-c.tgt{box-shadow:inset 0 0 0 1px var(--line-strong),inset 0 -3px 0 var(--warn)}
.ex-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--line);margin-top:2px}
.ex-foot .sp{flex:1}
.setctl{display:inline-flex;align-items:center;height:40px;border-radius:11px;background:var(--sunken)}
.setctl button{width:42px;height:40px;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--fg);border-radius:11px;text-align:center}
.setctl button[disabled]{opacity:.3;pointer-events:none}
.setctl span{min-width:62px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:11px;box-shadow:inset 0 0 0 1.5px var(--line-strong);font-size:14px;font-weight:600;color:var(--muted)}
.ghost-btn svg{width:17px;height:17px}
details.cue{font-size:14px;color:var(--fg);line-height:1.45;border-top:1px solid var(--line)}
details.cue summary{list-style:none;cursor:pointer;font-weight:600;color:var(--accent);min-height:46px;display:flex;align-items:center;gap:8px;padding:0 2px}
details.cue summary::-webkit-details-marker{display:none}
details.cue summary svg{width:18px;height:18px;flex:none}
details.cue summary .chev-d{margin-left:auto;width:22px;height:22px;color:var(--muted);transition:transform .2s}
details.cue[open] summary .chev-d{transform:rotate(180deg)}
details.cue[open] .when-closed,details.cue:not([open]) .when-open{display:none}
details.cue p{margin:0 2px 12px;color:var(--muted)}
.warm{background:var(--surface);border-radius:var(--r-l);padding:6px 14px}
.warm-i{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);min-height:52px;font-size:15px}
.warm-i:first-child{border-top:0}
.cb{flex:none;width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line-strong);display:grid;place-items:center;color:transparent}
.cb svg{width:18px;height:18px}
.warm-i.on .cb{background:var(--ok);box-shadow:none;color:var(--ok-ink)}
.warm-i.on .wt{color:var(--muted)}
.wt small{display:block;color:var(--muted);font-size:13px}
.finish{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.dateline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted);min-height:58px;text-align:center}
.tab.on{color:var(--accent)}
.tab svg{width:24px;height:24px}
.snav{display:flex;align-items:center;gap:10px;padding-block:8px}
.snav .mid{flex:1;min-width:0;text-align:center;font-size:13px;color:var(--muted);line-height:1.25}
.snav .mid b{display:block;font:600 16px/1.1 var(--f-display);color:var(--fg);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr{--t-bg:var(--accent);--t-ink:var(--accent-ink);margin-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 12px;padding:12px 12px 14px 16px;border-radius:16px;background:var(--t-bg);color:var(--t-ink);box-shadow:var(--shadow)}
.tmr.ended{--t-bg:var(--ok);--t-ink:var(--ok-ink)}
.tmr-time{font:700 46px/.9 var(--f-display);font-variant-numeric:tabular-nums;min-width:96px}
.tmr-info{min-width:0}
.tmr-l{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.tmr-n{font:600 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tmr-btns{display:flex;gap:6px}
.tmr .tb{flex:none;min-width:50px;height:44px;padding:0 8px;border-radius:11px;background:rgba(127,127,127,.25);background:color-mix(in srgb,var(--t-ink) 16%,transparent);color:inherit;font:600 17px/1 var(--f-display);text-align:center}
.tmr-bar{grid-column:1/-1;height:6px;border-radius:3px;overflow:hidden;background:rgba(127,127,127,.3);background:color-mix(in srgb,var(--t-ink) 22%,transparent)}
.tmr-bar i{display:block;height:100%;background:var(--t-ink);transform-origin:left center}
.tmr-rir{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid rgba(127,127,127,.35);border-top-color:color-mix(in srgb,var(--t-ink) 24%,transparent)}
.tmr-rir-q{font-size:15px;font-weight:600;line-height:1.3}
.tmr-rir-q span{display:block;font-weight:500;opacity:.82;font-size:13px;margin-top:1px}
.tmr-rir .rir-cs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tmr-rir .rir-c{height:44px;min-width:0;background:rgba(127,127,127,.25);background:color-mix(in srgb,var(--t-ink) 16%,transparent);color:inherit;box-shadow:none;font-size:19px}
.tmr-rir .rir-c.tgt{box-shadow:inset 0 -3px 0 var(--t-ink)}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:2px auto 0;flex:none}
.sheet h2{margin:0;font:700 27px/1.05 var(--f-display);text-transform:uppercase}
.sheet .lead{margin:-8px 0 0;color:var(--muted);font-size:15px}
.q{display:flex;flex-direction:column;gap:8px}
.q-l{font-weight:600;font-size:15px}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;min-height:46px;padding:6px 6px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:15px;text-align:center;line-height:1.15}
.seg button.on{background:var(--fg);color:var(--bg);box-shadow:none}
.seg.scale button{font:600 20px/1 var(--f-display)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--raised);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
textarea.note{width:100%;min-height:76px;border:0;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;resize:vertical;font-size:16px;line-height:1.4}
textarea.brief{width:100%;min-height:260px;border:0;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);padding:12px;font:400 14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.prose{font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:14px}
.prose h3{margin:0 0 2px;font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.prose p{margin:0;color:var(--muted)}
.news h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.news h3 small{font:500 14px/1 var(--f-body);color:var(--faint);text-transform:none;letter-spacing:0}
.news ul{margin:6px 0 0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.prose cite{font-style:normal;color:var(--faint);font-size:13px}

/* Check: Körperregionen */
.body-q{display:flex;flex-direction:column;gap:8px}
.bq-l{font-size:13px;font-weight:600;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{min-height:38px;padding:0 13px;border-radius:999px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--fg)}
.rchip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.rchip.pain.on{background:var(--bad);color:var(--bg)}

/* Gewicht finden */
.find{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;background:var(--accent-soft)}
.find-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;font-weight:600;color:var(--accent)}
.find-t{margin:0;font-size:15px;line-height:1.4;color:var(--fg)}
.find-steps{margin:0;padding-left:20px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.find-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:8px}
.find-in .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.find .num{background:var(--surface)}
.find-q{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600;font-size:15px;line-height:1.3}
.find-q span{font-size:13px;color:var(--accent);white-space:nowrap}
.find-r{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fr-b{height:50px;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:600 20px/1 var(--f-display);text-align:center;color:var(--fg)}
.fr-b.tgt{box-shadow:inset 0 0 0 2px var(--accent)}
.fr-b:active{transform:scale(.97)}
.find .ghost-btn{background:var(--surface);justify-content:center}
.find-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.find-foot .link{font-size:14px;min-height:36px}
.tag.find{background:var(--accent);color:var(--accent-ink)}
.tag.found,.tag.reps{background:var(--ok-soft);color:var(--ok)}
.sugg .act{display:inline-block;margin-top:4px;font-weight:600;color:var(--accent);min-height:32px}
.plan-row .tg .fd{color:var(--accent)}

/* Übung tauschen */
.opts{display:flex;flex-direction:column;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);min-height:62px}
.opt:first-child{border-top:0}
.opt .radio{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong)}
.opt.on{background:var(--accent-soft)}
.opt.on .radio{box-shadow:inset 0 0 0 7px var(--accent)}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font-weight:600}
.opt .tx small{display:block;font-size:13px;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
.opt .chips{flex:none;flex-direction:column;align-items:flex-end}
.sw-sec{display:flex;flex-direction:column;gap:8px}
.sw-sub{margin:-2px 0 0;font-size:13px;line-height:1.4;color:var(--muted)}

/* Anmeldung */
.login-f{display:flex;flex-direction:column;gap:8px}
.login-f .q-l{margin-top:4px}
.field{width:100%;height:50px;border:0;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;font-size:17px}
.field:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{margin:2px 0 0;color:var(--bad);font-size:14px;font-weight:600}
.err:empty{display:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h,84px) + 14px);transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;width:max-content;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;text-align:center;line-height:1.35}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Einstellungen */
.sgroup{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:58px}
.srow:first-child{border-top:0}
.srow .tx{flex:1;min-width:0}
.srow .tx b{font-weight:600;display:block}
.srow .tx small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.srow.col{flex-direction:column;align-items:stretch}
.sinput{flex:none;width:96px;height:42px;border:0;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:var(--raised);text-align:right;padding:0 10px;font:600 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sinput.date{width:auto;font:500 15px/1 var(--f-body);text-align:left}
.unit{font-size:13px;color:var(--muted);margin-left:-6px;min-width:14px}
.tgl{position:relative;flex:none;width:52px;height:32px}
.tgl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.tgl span{position:absolute;inset:0;border-radius:16px;background:var(--line-strong);transition:background .2s}
.tgl span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl input:checked+span{background:var(--accent)}
.tgl input:checked+span::after{transform:translateX(20px)}
.tgl input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* Fortschritt */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.wk{aspect-ratio:1;max-width:100%;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font:600 13px/1 var(--f-display);color:var(--faint)}
.wk.c1{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.wk.c2{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.wk.now{box-shadow:inset 0 0 0 2px var(--fg)}
.wk-l{font-size:10px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.scroller::-webkit-scrollbar{display:none}
.pchip{flex:none;min-height:38px;padding:0 13px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.pchip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.chart{width:100%;height:auto;display:block;max-width:100%}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lab{fill:var(--muted);font:500 11px var(--f-body)}
.ch-line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent-soft);opacity:.8}
.ch-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-last{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch-val{fill:var(--fg);font:700 14px var(--f-display)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 0;border-top:1px solid var(--line);vertical-align:baseline}
.tbl td:last-child{text-align:right;font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{color:var(--muted);white-space:nowrap;padding-right:12px;width:1%}
.vrow{display:grid;grid-template-columns:104px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px;min-height:28px}
.vtrack{position:relative;height:12px;border-radius:6px;background:var(--sunken);overflow:visible}
.vfill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.vavg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px}
.vref{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1.5px dashed var(--line-strong)}
.vnum{text-align:right;font:600 15px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.det-ex{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.det-ex:first-child{border-top:0}
.det-ex b{font-weight:600}
.det-ex span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

@media (max-width:380px){
  .num button{width:28px}
  .set-h,.set{grid-template-columns:30px minmax(0,1.15fr) minmax(0,.85fr) 46px;gap:6px}
  .ro .set-h,.ro .set{grid-template-columns:30px minmax(0,1fr) 46px}
  .chk{width:46px}
  .rir{margin-left:36px}
  .rir-c{min-width:34px}
  .hero h2{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){

function swapChoices(group){
  const g=GROUPS[group]; if(!g) return {same:[], other:[], fams:[]};
  const other=[], fams=[];
  (g.mus||[]).forEach(m=>{
    const f=FAMILIES[m]; if(!f) return;
    const ex=f.ex.filter(id=>EX[id] && !g.ex.includes(id) && !other.includes(id));
    other.push(...ex); if(ex.length) fams.push({label:f.label, ex});
  });
  return {same:g.ex.slice(), other, fams};
}
function swapAllowed(group, id){ const c=swapChoices(group); return c.same.includes(id) || c.other.includes(id); }
const EX_GROUP = {};
Object.keys(GROUPS).forEach(g=>GROUPS[g].ex.forEach(id=>{ if(!EX_GROUP[id]) EX_GROUP[id]=g; }));

      this.flushing = false;
      this.saveCache(); renderSync();
      if(!this.error && (this.pending.size || this.pendingDel.size || this.settingsPending)) this.schedule();
    }
  },
  handleError(e){
    this.error = e || {};
    const code = e && (e.code || e.status);
    if(code==='PGRST301' || code==='PGRST303' || code===401 || /jwt/i.test((e&&e.message)||'')){
      this.sb.auth.refreshSession().then(r=>{
        if(r && r.data && r.data.session){ this.error=null; this.flush(); this.pull(true); }
        else if(r && r.error && r.error.name==='AuthRetryableFetchError') this.scheduleRetry(20000);
        else this.needLogin();
      }).catch(()=>this.scheduleRetry(20000));
      return;
    }
    if(code==='42501'){ toast('Die Datenbank hat das Speichern abgelehnt. Prüf die Zugriffsregeln in Supabase.'); return; }
    this.scheduleRetry(navigator.onLine ? 10000 : 30000);
  },
  onOnline(){ if(this.mode==='offline') this.init(); else if(this.mode==='db'){ this.flush(); this.pull(true); } },
  onVisible(){ if(this.mode==='db'){ this.pull(false); this.flush(); } else if(this.mode==='offline') this.init(); },
  pendingCount(){ return this.pending.size + this.pendingDel.size + (this.settingsPending?1:0); },
  status(){
    const n=this.pendingCount();
    if(this.mode==='loading') return ['', 'Verbinde …'];
    if(this.mode==='config') return ['err', 'Nicht eingerichtet'];
    if(this.mode==='signedout') return ['', 'Nicht angemeldet'];
    if(this.mode==='offline' || !navigator.onLine) return ['local', n ? 'Offline · '+n+' offen' : 'Offline'];
    if(this.error) return ['err', 'Nicht synchronisiert'];
    if(n) return ['busy', 'Speichert …'];
    return ['ok', 'Gespeichert'];
  }
};

function saveUi(){ try{ localStorage.setItem(UI_KEY, JSON.stringify({cur:state.cur})); }catch(e){} }

/* =========================================================
   Abfragen
   ========================================================= */
function doneSessions(){ return Object.values(state.sessions).filter(s=>s.status==='done').sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)); }
function activeSession(){ const a=Object.values(state.sessions).filter(s=>s.status==='active').sort((a,b)=>(b.startedAt||0)-(a.startedAt||0)); return a[0]||null; }
function curSession(){ return state.editId ? (state.sessions[state.editId]||null) : activeSession(); }
function nextType(){ const l=doneSessions().find(s=>s.type==='A'||s.type==='B'); return l ? (l.type==='A'?'B':'A') : 'A'; }

function perfHistory(exId, beforeTs, excludeId){
  const out=[];
  for(const s of doneSessions()){
    if(s.id===excludeId || (s.startedAt||0) >= beforeTs) continue;
    for(const b of s.blocks) for(const e of b.items){
      if(e.ex!==exId || e.skipped) continue;
      const sets = e.sets.filter(x=>x.done && x.r!=null);
      if(sets.length) out.push({s, e, sets});
    }
  }
  return out;
}

function isReentry(date){
  const st=state.settings;
  if(!st.reentry) return false;
  const start = st.reentryStart || date;
  return date>=start && date<addDays(start, st.reentryDays||14);
}

/* =========================================================
   Progression (doppelte Progression mit RIR)
   ========================================================= */
function topWeight(sets, assist){ const ws=sets.map(x=>x.w==null?0:x.w); return assist ? Math.min(...ws) : Math.max(...ws); }

function fmtLoad(w, def){
  if(def.equip==='bw') return w>0 ? '+'+fmtW(w)+' kg' : 'Körpergewicht';
  if(def.equip==='assist') return fmtW(w)+' kg Hilfe';
  if(!w && def.zero) return 'ohne Gewicht';
  return fmtW(w)+' kg';
}

function fmtSets(sets, def, withRir){
  if(!sets.length) return '–';
  const side = def.side ? '/S' : '';
  const reps = def.load==='reps';
  const same = sets.every(x=>x.r===sets[0].r && (reps || x.w===sets[0].w));
  let txt;
  if(same) txt = sets.length+'×'+sets[0].r+side + (reps ? '' : ' @ '+fmtLoad(sets[0].w==null?0:sets[0].w, def));
  else txt = sets.map(x=> reps ? String(x.r) : fmtW(x.w)+'×'+x.r).join(', ') + (reps ? ' Wdh.'+(def.side?'/Seite':'') : (def.equip==='assist'?' (kg Hilfe)':def.equip==='bw'?' (+kg)':''));
  if(withRir && !def.noRir){ const r=sets.map(x=>x.rir==null?'?':(x.rir>=4?'4+':x.rir)); if(r.some(v=>v!=='?')) txt += ' · RIR '+r.join('/'); }
  return txt;
}

/* Erstes Mal: Übung im Wiedereinstieg noch nicht gemacht, sonst seit 4 Wochen nicht oder nie.
   Gilt pro Übung, nicht pro Einheit: B nach A ist für die B-Übungen trotzdem das erste Mal. */
function isFresh(exId, ctx){
  const last=perfHistory(exId, ctx.ts, ctx.excludeId)[0];
  if(!last) return true;
  if(ctx.reentry){ const rs=ctx.settings.reentryStart; return !rs || (last.s.date||'') < rs; }
  return (ctx.ts-(last.s.startedAt||0))/864e5 >= FIND_DAYS;
}
function computeTarget(exId, it, ctx){ const b=computeTargetRaw(exId, it, ctx); if(b && b.w!=null) b.w=snapW(b.w, EX[exId]); return b; }
function computeTargetRaw(exId, it, ctx){
  const def=EX[exId], st=ctx.settings;
  const lo=it.reps[0], hi=it.reps[1];
  const sets = ctx.reentry ? Math.min(it.sets,2) : it.sets;
  const fresh = !def.noRir && isFresh(exId, ctx);
  let rir = fresh ? [3,4] : ctx.reentry ? [2,3] : (def.rir || (def.main ? [1,2] : [1,3]));
  const notes=[];
  if(fresh && !ctx.reentry) notes.push('Neu oder länger nicht gemacht: 3–4 Wdh. in Reserve.');
  const chk = ctx.check || {};
  if(chk.intense && def.legs && !def.noRir){ rir=[Math.min(4,rir[0]+1), Math.min(4,rir[1]+1)]; notes.push('Gestern intensiv: 1 Wdh. mehr Reserve.'); }
  const sore=((normCheck(chk)||{}).sore||[]).filter(r=>regionHits(exId, r, 1));
  if(sore.length && !def.noRir){ rir=[Math.min(4,rir[0]+1), Math.min(4,rir[1]+1)]; notes.push('Muskelkater '+sore.map(regionName).join(', ')+': 1 Wdh. mehr Reserve.'); }
  const hist = perfHistory(exId, ctx.ts, ctx.excludeId);
  const last = hist[0];
  const base = {sets, reps:[lo,hi], rir, w:null, perSet:Array(sets).fill(lo), action:'new', reason:'', notes, fresh};

  if(exId==='nordic') return nordicTarget(it, ctx, hist, base);

  if(def.load==='reps'){
    base.perSet = Array(sets).fill(hi);
    base.action = last ? 'hold' : 'new';
    base.reason = last ? 'Gleiche Vorgabe. Fortschritt über langsameres, saubereres Tempo.' : 'Sauber und kontrolliert, Qualität vor Menge.';
    return base;
  }

  const inc = incFor(def, st);
  const minW = def.equip==='bb' ? (+st.barKg||20) : 0;
  const assist = def.equip==='assist';

  if(!last){
    const p = +((st.prev||{})[exId]) || 0;
    if(p>0 && assist){ base.w=p; base.action='start'; base.reason='Gleiche Unterstützung wie früher. Zu leicht? Eine Stufe weniger.'; }
    else if(p>0){ const f = ctx.reentry ? 0.65 : 0.8; base.w=Math.max(minW, roundTo(p*f, inc, 'down')); base.action='start'; base.reason=Math.round(f*100)+' % deines früheren Gewichts ('+fmtW(p)+' kg). Technik vor Last.'; }
    else if(def.equip==='bw'){ base.w=0; base.reason='Ohne Zusatzgewicht starten.'; }
    else if(def.zero){ base.w=0; base.reason='Erst ohne Gewicht, Bewegung sauber lernen.'; }
    else if(def.equip==='bb'){ base.w=minW; base.reason='Erstes Mal: mit der Stange ('+fmtW(minW)+' kg) beginnen und steigern, bis RIR '+rirTxt(rir)+' passt.'; }
    else base.reason='Erstes Mal: Gewicht wählen, mit dem du RIR '+rirTxt(rir)+' schaffst.';
    return base;
  }

  const topW = topWeight(last.sets, assist);
  const atW = last.sets.filter(x=>(x.w==null?0:x.w)===topW);
  const lastTgt = last.e.target || {};
  const need = Math.min(sets, lastTgt.sets || atW.length);
  const allTop = atW.length>=need && atW.every(x=>x.r>=hi);
  const rirs = atW.map(x=>x.rir).filter(x=>x!=null);
  const avgRir = rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  const lastRirHi = lastTgt.rir ? lastTgt.rir[1] : rir[1];
  const tooEasy = avgRir!=null && avgRir>lastRirHi;
  const fromReentry = !!last.s.reentry && !ctx.reentry;
  const below = atW.some(x=>x.r<lo);
  const lastTxt = fmtSets(atW, def, false);

  if(allTop){
    base.action='up'; base.perSet=Array(sets).fill(lo);
    if(assist){
      base.w = Math.max(0, rnd(topW-inc));
      base.reason = base.w===0 ? 'Letztes Mal '+lastTxt+'. Zeit für Klimmzüge ohne Hilfe.' : 'Letztes Mal '+lastTxt+' → '+fmtW(inc)+' kg weniger Hilfe, wieder ab '+lo+' Wdh.';
    } else if(def.equip==='bw'){
      base.w = rnd(topW+2.5);
      base.reason = 'Letztes Mal '+lastTxt+' → +2.5 kg Zusatzgewicht oder 3 s langsam absenken.';
    } else {
      const pct = (tooEasy||fromReentry) ? 0.05 : 0.025;
      const w = topW>0 ? Math.max(rnd(topW+inc), roundTo(topW*(1+pct), inc, 'up')) : rnd(inc*2);
      base.w = Math.max(minW, w);
      base.reason = 'Letztes Mal '+lastTxt+(tooEasy?' mit Luft':'')+' → +'+fmtW(rnd(base.w-topW))+' kg, wieder ab '+lo+' Wdh.';
      if(topW>0 && (base.w-topW)/topW>0.1) base.notes.push('Grosser Sprung: lieber erst '+lo+' saubere Wdh. als mehr.');
    }
    return base;
  }

  if(below){
    const p2 = hist[1];
    const p2below = p2 && topWeight(p2.sets, assist)===topW && p2.sets.filter(x=>(x.w==null?0:x.w)===topW).some(x=>x.r<lo);
    base.perSet = Array(sets).fill(lo);
    if(p2below){
      base.action='down';
      base.w = assist ? rnd(topW+inc) : Math.max(minW, roundTo(topW*0.9, inc, 'down'));
      base.reason = 'Zweimal unter '+lo+' Wdh. bei '+fmtLoad(topW, def)+' → '+(assist?'eine Stufe mehr Hilfe':'rund 10 % leichter')+' und neu aufbauen.';
    } else {
      base.action='hold'; base.w=topW;
      base.reason = 'Letztes Mal '+lastTxt+'. Gewicht halten, Ziel: jeder Satz mindestens '+lo+' Wdh.';
    }
    return base;
  }

  base.action='hold'; base.w=topW;
  base.perSet = Array.from({length:sets}, (_,i)=>{ const r=(atW[i]||atW[atW.length-1]).r; return Math.min(hi, r+1); });
  base.reason = fromReentry
    ? 'Wiedereinstieg vorbei: gleiches Gewicht, jetzt '+sets+' Sätze bei RIR '+rirTxt(rir)+'.'
    : 'Letztes Mal '+lastTxt+'. Gleiches Gewicht, pro Satz 1 Wdh. mehr (bis '+hi+').';
  return base;
}

function ladderLevel(sets){
  const n=sets.length; if(!n) return -1;
  const m=Math.min(...sets.map(x=>x.r||0)); let lv=-1;
  LADDER.forEach((L,i)=>{ if(n>=L[0] && m>=L[1]) lv=i; });
  return lv;
}

function nordicTarget(it, ctx, hist, base){
  const capS = ctx.reentry ? Math.min(2,it.sets) : it.sets;
  const capR = it.reps[1];
  let lv, action, reason;
  if(!hist.length){ lv=0; action='new'; reason='Einstieg 2 × 3 wie im Plan. Muskelkater in den ersten Wochen ist normal.'; }
  else {
    const last=hist[0];
    const got=ladderLevel(last.sets);
    const gap=(ctx.ts-(last.s.startedAt||0))/864e5;
    if(got<0){ lv=0; action='hold'; reason='Einstiegsstufe 2 × 3 wiederholen.'; }
    else if(gap>21){ lv=Math.max(0,got-1); action='down'; reason='Über 3 Wochen seit den letzten Nordics → eine Stufe zurück, damit der Muskelkater klein bleibt.'; }
    else if(ctx.check && ((normCheck(ctx.check).sore||[]).includes('back'))){ lv=got; action='hold'; reason='Muskelkater Beine hinten: Stufe halten.'; }
    else { lv=Math.min(LADDER.length-1, got+1); action = lv>got ? 'up' : 'hold'; reason = lv>got ? 'Letztes Mal '+fmtSets(last.sets, EX.nordic, false)+' → nächste Stufe.' : 'Höchste Stufe erreicht: halten und noch langsamer absenken.'; }
  }
  const s = Math.min(LADDER[lv][0], capS);
  const r = Math.min(LADDER[lv][1], capR);
  Object.assign(base, {sets:s, reps:[r,r], perSet:Array(s).fill(r), w:null, action, reason, level:lv});
  return base;
}

/* =========================================================
   Gewicht finden (Prozess: docs/gewicht-finden.bpmn)
   ========================================================= */
function canFind(def, exId){ return def.load!=='reps' && exId!=='nordic'; }
const FIND_RANGE = {r0:[0,0], r12:[1,2], r34:[3,4], r57:[5,7], r8:[8,99]};
function findTr(f){ return f.tr || (f.high ? [3,4] : [1,2]); }
function findOverlaps(key, tr){ const r=FIND_RANGE[key]; return r[1]>=tr[0] && r[0]<=tr[1]; }
function findMinW(def){ return def.equip==='bb' ? (+state.settings.barKg||20) : 0; }
function findRound(w, def){
  if(def.equip==='bw') return Math.max(0, rnd(w));
  return snapW(Math.max(findMinW(def), roundTo(w, incFor(def, state.settings), 'near')), def);
}
function findPlan(exId, ctx){
  const def=EX[exId], st=ctx.settings;
  if(!canFind(def, exId) || st.autoFind===false || ctx.noFind) return null;
  const last=perfHistory(exId, ctx.ts, ctx.excludeId)[0];
  const inc=incFor(def, st), assist=def.equip==='assist';
  if(last){
    const days=(ctx.ts-(last.s.startedAt||0))/864e5;
    if(days<FIND_DAYS) return null;
    const topW=topWeight(last.sets, assist), wk=Math.round(days/7);
    if(days<=84) return {start: assist ? roundTo(topW*1.15, inc, 'up') : findRound(topW*0.85, def), why:'Zuletzt vor '+wk+' Wochen mit '+fmtLoad(topW,def)+'. Start bei −15 %.'};
    return {start: assist ? roundTo(Math.max(topW*1.5, topW+2*inc), inc, 'up') : findRound(topW*0.5, def), why:'Zuletzt vor '+wk+' Wochen. Start bei der Hälfte von '+fmtLoad(topW,def)+'.'};
  }
  const p=+((st.prev||{})[exId])||0;
  if(p>0) return {start: assist ? p : findRound(p*0.5, def), why:'Start bei der Hälfte deines früheren Gewichts ('+fmtW(p)+' kg).'};
  const s0 = FIND_START[exId]!=null ? FIND_START[exId] : findMinW(def);
  return {start: def.equip==='bb' ? Math.max(findMinW(def), s0) : s0, why:'Noch kein Gewicht bekannt, darum ein vorsichtiger Start.'};
}
function findBegin(e, ctxReentry, start, why, manual){
  const def=EX[e.ex];
  start=snapW(start, def);
  e.find={status:'active', tr:(e.target.rir||[1,2]).slice(), start, w:start, r:e.target.reps[0], steps:[], why, manual:!!manual};
  e.target.action='find'; e.target.reason=why; e.target.w=null;
  e.sets.forEach(x=>{ if(!x.done) x.w=null; });
}
function findDecide(e, rating, reps){
  const tr=findTr(e.find), lo=e.target.reps[0], hi=e.target.reps[1];
  if(rating==='tech' || (reps!=null && reps<lo)) return 'down';
  if(reps!=null && reps>hi) return 'upE';
  const r=FIND_RANGE[rating];
  if(r[1]<tr[0]) return 'down';
  if(findOverlaps(rating, tr)) return 'found';
  return rating==='r34' ? 'up10' : rating==='r57' ? 'up25' : 'up50';
}
/* Schätzung nach Epley inkl. Reserve: Gewicht für die geplanten Wdh. mit Ziel-Reserve.
   Nur bei echten Gewichten; bei Körpergewicht und Klimmzug-Maschine fehlt das Körpergewicht. */
const FIND_MID = {r0:0, r12:1.5, r34:3.5, r57:6, r8:8};
function findEst(e, def, w, r, rating){
  if(!w || rating==='tech' || r==null || ['bw','assist','none'].includes(def.equip)) return null;
  const tr=findTr(e.find), lo=e.target.reps[0];
  return w*(1+(r+FIND_MID[rating])/30)/(1+(lo+(tr[0]+tr[1])/2)/30);
}
function findHeavier(w, def, pct){
  const st=state.settings, inc=incFor(def, st);
  if(def.equip==='assist') return Math.max(0, Math.min(rnd(w-inc), roundTo(w*(1-pct), inc, 'down')));
  if(def.equip==='bw') return rnd(w + (pct>=0.5 ? 10 : pct>=0.25 ? 5 : 2.5));
  if(!w) return def.equip==='db' ? 4 : def.equip==='bb' ? findMinW(def) : rnd(inc*2);
  return Math.max(rnd(w+inc), roundTo(w*(1+pct), inc, 'near'));
}
function findLighter(w, def){
  const inc=incFor(def, state.settings);
  if(def.equip==='assist') return rnd(w+inc);
  if(def.equip==='bw') return Math.max(0, rnd(w-2.5));
  if(!w) return 0;
  return Math.max(findMinW(def), Math.min(rnd(w-inc), roundTo(w*0.9, inc, 'near')));
}
/* Eingrenzen: lo = schwerstes Gewicht, das zu leicht war, hi = leichtestes, das zu schwer war.
   Bei der Klimmzug-Maschine ist weniger Hilfe schwerer, deshalb wird über D() verglichen. */
function findBounds(f, def){
  const D = w => def.equip==='assist' ? -w : w; let lo=null, hi=null;
  f.steps.forEach(st=>{
    if(st.kind==='down'){ if(hi==null || D(st.w)<D(hi)) hi=st.w; }
    else if(st.kind!=='found'){ if(lo==null || D(st.w)>D(lo)) lo=st.w; }
  });
  return {lo, hi, D};
}
/* Nächstes Probegewicht, immer echt zwischen lo und hi. null = keine Stufe mehr frei. */
function findNext(w, kind, f, def, est){
  const inc=incFor(def, state.settings), sg=def.equip==='assist'?-1:1, {lo,hi,D}=findBounds(f, def);
  let nw = kind==='down' ? findLighter(w, def) : findHeavier(w, def, kind==='up25'?0.25:kind==='up50'?0.5:0.10);
  // Weniger oder mehr Wdh. als geplant: Schätzung, mindestens so weit wie die Grundregel
  if(est!=null) nw = kind==='down' ? Math.max(findMinW(def), Math.min(nw, roundTo(est, inc, 'near'))) : Math.max(nw, roundTo(est, inc, 'down'));
  nw=snapW(nw, def);
  if(nw===w && gridOf(def)) nw=snapW(rnd(w+(kind==='down'?-1:1)*sg*inc), def);
  if(hi!=null && D(nw)>=D(hi)) nw=rnd(hi-sg*inc);
  if(lo!=null && D(nw)<=D(lo)) nw=rnd(lo+sg*inc);
  if(nw<0 || nw===w || (def.equip==='bb' && nw<findMinW(def))) return null;
  if((hi!=null && D(nw)>=D(hi)) || (lo!=null && D(nw)<=D(lo))) return null;
  return nw;
}
function findStepText(st, def){
  const head=fmtLoad(st.w,def)+' × '+st.r+' · '+FIND_LABEL[st.rating];
  const nx = st.next!=null && st.next!==st.w ? ', '+fmtLoad(st.next,def) : '';
  if(st.kind==='found') return head+' → gefunden';
  if(st.kind==='down') return head+(st.rating==='tech' ? ' → leichter' : ' → zu schwer')+nx;
  return head+' → zu leicht'+nx;
}
/* Wie viele Übungen der Einheit sind zum ersten Mal dran? Alte Einheiten ohne target.fresh: nach reentryFirst. */
function freshKind(s){
  const f=[]; s.blocks.forEach(b=>b.items.forEach(e=>{ const d=EX[e.ex]; if(!e.skipped && d && !d.noRir && e.target) f.push(e.target.fresh!=null ? !!e.target.fresh : !!s.reentryFirst); }));
  const n=f.filter(Boolean).length; return n===f.length ? 'all' : n===0 ? 'none' : 'mixed';
}
function findActive(s){ let n=0; s.blocks.forEach(b=>b.items.forEach(e=>{ if(!e.skipped && e.find && e.find.status==='active') n++; })); return n; }
function findCanUndo(e){ return e.find && e.find.steps.length>0 && !e.sets.some(x=>x.done && !x.probe); }

/* =========================================================
   Einheit erstellen
   ========================================================= */
function makeEntry(exId, it, ctx){
  const def = EX[exId];
  const reps = (def.reps && exId!==it.ex) ? def.reps.slice() : it.reps.slice();
  const t = computeTarget(exId, {sets:it.sets, reps}, ctx);
  const e = {ex:exId, key:it.key||null, group:it.group||null, plan:{sets:it.sets, reps:reps.slice()}, target:t,
    sets:Array.from({length:t.sets}, (_,i)=>({w:t.w, r:t.perSet[i]!=null?t.perSet[i]:t.reps[0], rir:null, done:false})), skipped:false};
  const fp = findPlan(exId, ctx);
  if(fp) findBegin(e, ctx.reentry, fp.start, fp.why, false);
  return e;
}

function buildSession(type, opts){
  opts = opts||{};
  const st = state.settings;
  const date = opts.date || todayStr();
  const ts = opts.date && opts.date!==todayStr() ? parseYmd(date).getTime()+18*3600e3 : Date.now();
  if(!opts.preview && type!=='H' && st.reentry && !st.reentryStart){ st.reentryStart=date; Store.saveSettings(); }
  const re = type!=='H' && isReentry(date);
  const firstRe = re && !Object.values(state.sessions).some(x=>x.status==='done' && x.type!=='H' && x.date>=(st.reentryStart||date));
  const id = opts.preview ? 'preview' : uid(date);
  const ctx = {settings:st, reentry:re, firstReentry:firstRe, ts, excludeId:id, check:opts.check||null, noFind:!!opts.backlog};
  const blocks=[];
  PLANS[type].blocks.forEach(pb=>{
    if(pb.opt && !st[pb.opt]) return;
    const items = pb.items.map(it=> makeEntry(resolveEx(it), it, ctx));
    blocks.push({ss:!!pb.ss, opt:pb.opt||null, rest:pb.rest, items});
  });
  if(opts.short && type!=='H'){
    blocks.forEach((b,i)=>{ if(i>2) b.items.forEach(e=>{ e.skipped=true; e.skipWhy='Kurzversion'; }); });
  }
  const pain=((normCheck(opts.check)||{}).pain)||[];
  if(pain.length){
    blocks.forEach(b=>b.items.forEach(e=>{ const hit=pain.filter(r=>regionHits(e.ex, r, 0.5)); if(hit.length && !e.skipped){ e.skipped=true; e.skipWhy='Schmerz '+hit.map(regionName).join(', '); } }));
  }
  return {id, v:1, type, status: opts.backlog ? 'backlog' : 'active', date, startedAt:ts, endedAt:null,
    reentry:re, reentryFirst:firstRe, short:!!opts.short, check:opts.check||null,
    warmup: type==='H' ? [] : WARMUP.map(()=>false), blocks, feel:null, fun:null, note:''};
}

function swapEntry(s, bi, ii, exId, scope){
  const b=s.blocks[bi], e=b.items[ii], key=entryKey(s,e), grp=entryGroup(e);
  const pit = planItemIn(s.type, key) || planItemAny(key) || {key, group:grp, ex:e.ex, sets:e.plan.sets, reps:e.plan.reps};
  const ctx = {settings:state.settings, reentry:s.reentry, firstReentry:!!s.reentryFirst, ts:s.startedAt, excludeId:s.id, check:s.check};
  const done = e.sets.filter(x=>x.done), from=e.ex;
  if(done.length){
    const remaining = Math.max(1, e.sets.length-done.length);
    e.sets = done; e.swappedTo = exId;
    const ne = makeEntry(exId, Object.assign({}, pit, {sets:remaining}), ctx);
    ne.swapFrom = from;
    b.items.splice(ii+1, 0, ne);
  } else {
    const ne = makeEntry(exId, pit, ctx);
    const planned = resolveEx(pit);
    if(scope==='once' && exId!==planned) ne.swapFrom = planned;
    b.items[ii] = ne;
  }
}

/* =========================================================
   Auswertung
   ========================================================= */
function loadOf(set, def){
  const bw = +state.settings.bodyweight || 0;
  if(def.equip==='bw') return (bw && def.bwLoad) ? bw+(set.w||0) : null;
  if(def.equip==='assist') return bw ? bw-(set.w||0) : null;
  return set.w;
}
function e1rm(set, def){
  if(def.load==='reps' || !set.done) return null;
  const L = loadOf(set, def);
  if(!L || L<=0 || !set.r) return null;
  const reps = set.r + (set.rir==null?0:set.rir);
  if(reps>20) return null;
  return L*(1+reps/30);
}
function bestE1rm(sets, def){ let b=0; sets.forEach(x=>{ const v=e1rm(x,def); if(v&&v>b) b=v; }); return b; }

function sessionStats(s){
  let sets=0, vol=0, ex=0;
  for(const b of s.blocks) for(const e of b.items){
    if(e.skipped) continue;
    const d=e.sets.filter(x=>x.done); if(d.length) ex++;
    sets+=d.length;
    const def=EX[e.ex];
    if(def.load!=='reps' && def.equip!=='assist' && def.equip!=='bw') d.forEach(x=>{ vol+=(x.w||0)*(x.r||0)*(def.side?2:1)*(def.pair?2:1); });
  }
  const dur = s.endedAt && s.startedAt ? Math.round((s.endedAt-s.startedAt)/60000) : null;
  return {sets, vol, ex, dur};
}
function totalSets(s){ let n=0,d=0; for(const b of s.blocks) for(const e of b.items){ if(e.skipped) continue; n+=e.sets.length; d+=e.sets.filter(x=>x.done).length; } return [d,n]; }

function sessionPRs(s){
  const out=[];
  for(const b of s.blocks) for(const e of b.items){
    const def=EX[e.ex]; if(e.skipped || def.load==='reps') continue;
    const best=bestE1rm(e.sets, def); if(!best) continue;
    let prev=0; perfHistory(e.ex, s.startedAt, s.id).forEach(h=>{ const v=bestE1rm(h.sets, def); if(v>prev) prev=v; });
    if(prev>0 && best>prev+0.05 && !out.some(o=>o.ex===e.ex)) out.push({ex:e.ex, val:best, prev});
  }
  return out;
}

function weekSessions(ws){ const we=addDays(ws,6); return doneSessions().filter(s=>s.date>=ws && s.date<=we); }
function weekVolume(ws){
  const v={};
  weekSessions(ws).forEach(s=>s.blocks.forEach(b=>b.items.forEach(e=>{
    if(e.skipped) return; const n=e.sets.filter(x=>x.done).length; if(!n) return;
    const m=EX[e.ex].m; for(const k in m) v[k]=(v[k]||0)+n*m[k];
  })));
  return v;
}
function hamThisWeek(ws){
  const r={hinge:false, nordic:false, ecc:false};
  weekSessions(ws).forEach(s=>s.blocks.forEach(b=>b.items.forEach(e=>{
    if(e.skipped || !e.sets.some(x=>x.done)) return;
    const g=entryGroup(e);
    if(g==='hinge') r.hinge=true;
    if(e.ex==='nordic') r.nordic=true; else if(g==='eccHam') r.ecc=true;
  })));
  return r;
}

function estimateMin(s){
  const st=state.settings; let sec = (s.warmup.length ? 540 : 60) + findActive(s)*120;
  s.blocks.forEach(b=>{
    const its=b.items.filter(e=>!e.skipped); if(!its.length) return;
    const rest=st.rest[b.rest]||90;
    if(b.ss){ const rounds=Math.max(...its.map(e=>e.sets.length)); sec += rounds*its.length*50 + rounds*rest + 45; }
    else { const n=its[0].sets.length; sec += n*50 + (n-1)*rest + 75; }
  });
  return Math.max(5, Math.round(sec/300)*5);
}

function plates(total, single){
  const bar = single ? 0 : (+state.settings.barKg||20);
  let side = single ? total : (total-bar)/2;
  if(side<0) return null;
  const sizes=[25,20,15,10,5,2.5,1.25], res=[];
  for(const p of sizes){ while(side>=p-1e-9){ res.push(p); side=rnd(side-p); } }
  return {res, rest:rnd(side)};
}
function plateHtml(w, def){
  if(w==null || (def.equip!=='bb' && def.equip!=='lm')) return '';
  const p = plates(w, def.equip==='lm');
  if(!p) return '<span>Leichter als die Stange</span>';
  if(!p.res.length) return '<span>'+(def.equip==='lm'?'Nur Stange':'Nur die Stange')+'</span>';
  const cls = v => v===25?'p25':v===20?'p20':v===15?'p15':v===10?'p10':v===5?'p5':'psm';
  return '<span>'+(def.equip==='lm'?'Scheiben':'Pro Seite')+'</span>'+p.res.map(v=>'<span class="pl '+cls(v)+'">'+fmtW(v)+'</span>').join('')+(p.rest>0?'<span>+ '+fmtW(p.rest)+' kg</span>':'');
}
function warmupSets(w, def){
  if(!def.main || w==null || !(def.equip==='bb'||def.equip==='db')) return '';
  const st=state.settings, inc=incFor(def, st), bar=+st.barKg||20;
  const min = def.equip==='bb' ? bar : inc;
  const out=[], seen=new Set();
  if(def.equip==='bb' && w>=bar*1.6){ out.push('Stange × 8'); seen.add(bar); }
  [[0.5,6],[0.7,4],[0.85,2]].forEach(([p,r])=>{ const x=Math.max(min, roundTo(w*p, inc, 'near')); if(x<w && !seen.has(x)){ seen.add(x); out.push(fmtW(x)+' kg × '+r); } });
  return out.length ? 'Aufwärmsätze: '+out.join(' · ') : '';
}

/* =========================================================
   Briefing-Text & CSV
   ========================================================= */
function briefingText(off){
  const ws = addDays(weekStart(todayStr()), -7*off), we = addDays(ws,6);
  const list = doneSessions().filter(s=>s.date>=ws && s.date<=we).sort((a,b)=>a.startedAt-b.startedAt);
  const gym = list.filter(s=>s.type!=='H').length, home = list.length-gym;
  let out = 'Gym KW '+isoWeek(ws)+' ('+fmtShort(ws)+'–'+fmtShort(we)+'): '+gym+' '+(gym===1?'Einheit':'Einheiten')+(home?', '+home+'× Heimroutine':'');
  if(!list.length) return out+'\nKeine Einheit erfasst.';
  list.forEach(s=>{
    const st=sessionStats(s);
    out += '\n\n'+WD[parseYmd(s.date).getDay()]+' '+fmtShort(s.date)+' · '+typeName(s.type)+(st.dur?' · '+st.dur+' min':'')+(s.reentry?' · Wiedereinstieg':'')+(s.short?' · Kurzversion':'');
    s.blocks.forEach(b=>b.items.forEach(e=>{
      const def=EX[e.ex], d=e.sets.filter(x=>x.done);
      if(e.skipped) out += '\n- '+def.name+': ausgelassen'+(e.skipWhy?' ('+e.skipWhy+')':'');
      else if(d.length) out += '\n- '+def.name+': '+fmtSets(d, def, true)+(e.find && e.find.status==='done' ? ' · '+(e.find.counted?'Gewicht gefunden':'Gewicht eingegrenzt')+' ('+e.find.steps.length+' '+(e.find.steps.length===1?'Probesatz':'Probesätze')+': '+e.find.steps.map(st=>fmtW(st.w)+'×'+st.r+' '+(st.rating==='tech'?'Technik wackelte':'RIR '+FIND_RATINGS.find(x=>x[0]===st.rating)[1])).join(', ')+')' : '');
    }));
    if(s.feel!=null || s.fun!=null) out += '\nGefühl '+(s.feel==null?'–':s.feel)+'/5 · Spass '+(s.fun==null?'–':s.fun)+'/5';
    if(s.check) out += '\nVorher: '+checkText(s.check);
    const prs=sessionPRs(s); if(prs.length) out += '\nBestwerte (geschätztes 1RM): '+prs.map(p=>exName(p.ex)+' '+fmtW(rnd(p.val))+' kg').join(', ');
    if(s.note) out += '\nNotiz: '+s.note;
  });
  return out;
}

function csvText(){
  const rows=[['datum','einheit','uebung','satz','gewicht_kg','wdh','rir','pro_seite','abgehakt','ausgelassen','gefuehl','spass']];
  doneSessions().slice().reverse().forEach(s=>s.blocks.forEach(b=>b.items.forEach(e=>{
    const def=EX[e.ex];
    e.sets.forEach((x,i)=>rows.push([s.date, s.type, def.name, i+1, x.w==null?'':x.w, x.r==null?'':x.r, x.rir==null?'':x.rir, def.side?'ja':'nein', x.done?'ja':'nein', e.skipped?'ja':'nein', s.feel==null?'':s.feel, s.fun==null?'':s.fun]));
  })));
  return rows.map(r=>r.map(v=>{ const t=String(v); return /[;"\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; }).join(';')).join('\n');
}

function rirPrompt(s){
  let best=null;
  s.blocks.forEach((b,bi)=>b.items.forEach((e,ii)=>{

    e.sets.forEach((x,si)=>{ if(x.done && x.rir==null && (!best || (x.t||0)>(best.x.t||0))) best={bi,ii,si,x,e}; });
  }));
  if(!best) return '';
  const def=EX[best.e.ex], t=best.e.target, x=best.x;
  const sref='data-b="'+best.bi+'" data-i="'+best.ii+'" data-s="'+best.si+'"';
  const what=(def.short||def.name)+' · Satz '+(best.si+1)+' · '+(x.w!=null && def.load!=='reps' ? fmtLoad(x.w,def)+' × ' : '')+x.r+' Wdh.';
  return '<div class="tmr-rir" role="group" aria-label="RIR für '+esc(def.name)+', Satz '+(best.si+1)+'"><div class="tmr-rir-q">Wie viele Wdh. wären noch drin gewesen?<span>'+esc(what)+'</span></div><span class="rir-cs">'

}

function phaseText(d){
  const p=phaseOf(d);
  if(!p) return d<PHASES[0].from ? '' : 'Nach dem Z10: die nächste Phase im Briefing planen.';
  if(p.n===0) return d<='2026-11-01' ? 'Marathon-Erholung: diese Woche nur Bewegung. Gym-Wiedereinstieg ab Montag, 2. Nov.' : 'Gym-Wiedereinstieg: 2 Sätze pro Übung, beim ersten Mal pro Übung 3–4 Wdh. in Reserve, danach 2–3. Technik vor Last.';
  if(p.n===1) return 'Gym-Routine aufbauen. Baseline ist 1× pro Woche, die 2. Einheit ist Bonus.';
  if(p.n===2) return 'Gym 1–2× pro Woche. Den Qualitätslauf nicht auf den Tag nach schweren Beinen legen.';
  if(d>=addDays(Z10,-6)) return 'Z10-Woche: Gym nur locker oder auslassen.';
  return 'Gym auf 1× pro Woche reduziert, Beine mit etwas mehr Reserve.';
}

function blockLabels(s){
  let n=0; return s.blocks.map(b=> b.opt ? (b.opt==='arms'?'Bonus':'Erhalt') : b.items.map(()=>++n).join('+'));
}
function blockLabel(s,bi){ return blockLabels(s)[bi]; }
function blockDone(b){ return b.items.every(e=>e.skipped || e.sets.every(x=>x.done)); }
function curBlock(s){
  if(state.cur[s.id]!=null && state.cur[s.id] < s.blocks.length) return state.cur[s.id];
  const anyDone = s.blocks.some(b=>b.items.some(e=>e.sets.some(x=>x.done)));
  if(s.warmup.length && !anyDone && !s.warmup.every(Boolean) && !state.editId) return -1;
  const i=s.blocks.findIndex(b=>!blockDone(b));
  return i<0 ? Math.max(0,s.blocks.length-1) : i;
}
function setCur(s, i){ state.cur[s.id]=i; saveUi(); }
function restOf(b){ return +state.settings.rest[b.rest] || 90; }

function closedBlock(b,bi,label){

function openBlock(s,b,bi,label){

function entryCard(s,bi,ii){
  const e=s.blocks[bi].items[ii], def=EX[e.ex], t=e.target, eq=EQUIP[def.equip];
  const ref='data-b="'+bi+'" data-i="'+ii+'"';

  }

  const prev = perfHistory(e.ex, s.startedAt, s.id)[0];
  const firstOpen = e.sets.findIndex(x=>!x.done);

  let h='<article class="ex'+(ro?' ro':'')+'" id="ex-'+bi+'-'+ii+'"><div class="ex-head"><div class="tx">'+(tags.length?'<span class="ex-tag">'+esc(tags.join(' · '))+'</span>':'')+'<h3>'+esc(def.name)+'</h3><div class="ex-meta">'+meta.join(' · ')+'</div></div>'+(canSwap?'<button class="swap-btn" data-a="swap-open" '+ref+' aria-label="'+esc(def.name)+' tauschen">'+I.swap+'Tauschen</button>':'')+'</div>';
  const f=e.find;
  if(f && f.status==='active' && !state.editId){ h+=findPanel(s,bi,ii)+'<div class="ex-foot"><button class="ghost-btn" data-a="fd-skip" '+ref+'>Ich kenne mein Gewicht</button><span class="sp"></span>'+(EQUIP[def.equip].inc?'<button class="ghost-btn" data-a="steps-open" '+ref+'>Schritte</button>':'')+'<button class="ghost-btn" data-a="skip" '+ref+'>'+I.skip+'Auslassen</button></div>'; h+='<details class="cue"><summary>'+I.info+'<span class="when-closed">Technik-Tipp anzeigen</span><span class="when-open">Technik-Tipp</span>'+I.chevD+'</summary><p>'+esc(def.cue)+'</p></details>'; return h+'</article>'; }

  let extra='';
  if(f && f.status==='done') extra='<span class="note" style="color:var(--muted)">'+esc(f.steps.map(st=>findStepText(st,def)).join(' · '))+'</span>'+(findCanUndo(e)&&!state.editId?'<button class="act" data-a="fd-undo" '+ref+'>Letzten Probesatz zurücknehmen</button>':'');
  else if(canFind(def, e.ex) && !e.sets.some(x=>x.done) && !state.editId && s.type!=='H') extra='<button class="act" data-a="fd-start" '+ref+'>Gewicht neu finden</button>';
  h+='<div class="sugg"><span class="tag '+t.action+'">'+tagTxt+'</span><span>'+esc(t.reason)+(t.notes&&t.notes.length?t.notes.map(n=>'<span class="note">'+esc(n)+'</span>').join(''):'')+(extra?'<br>'+extra:'')+'</span></div>';
  if(f && f.suggestAssist && !state.editId) h+='<div class="callout">'+I.warn+'<div><b>'+(f.steps.length && f.steps[f.steps.length-1].r<t.reps[0] ? 'Weniger als '+t.reps[0]+' saubere Wdh.' : 'Zu wenig Reserve.')+'</b> Mit Unterstützung kommst du in den Zielbereich.<div><button class="link" data-a="fd-assist" '+ref+'>Heute Klimmzüge assistiert</button></div></div></div>';
  const wNow = firstOpen>-1 ? e.sets[firstOpen].w : (e.sets.length?e.sets[e.sets.length-1].w:null);
  const pl=plateHtml(wNow, def), wu=(state.editId || (f && f.status==='done'))?'':warmupSets(t.w, def);
  if(pl || wu) h+='<div class="aux">'+(pl?'<div class="aux-row" id="pl-'+bi+'-'+ii+'">'+pl+'</div>':'')+(wu?'<div>'+wu+'</div>':'')+'</div>';
  h+='<div class="sets"><div class="set-h"><span>Satz</span>'+(ro?'':'<span>'+eq.col+'</span>')+'<span>'+(def.side?'Wdh/S':'Wdh')+'</span><span></span></div>';
  e.sets.forEach((x,si)=>{
    const sref=ref+' data-s="'+si+'"';
    const p = prev && prev.sets[si] ? (ro ? String(prev.sets[si].r) : fmtW(prev.sets[si].w)+'×'+prev.sets[si].r) : '';
    h+='<div class="set'+(x.done?' is-done':'')+(si===firstOpen?' is-next':'')+'"><div class="set-n"><b>'+(si+1)+'</b>'+(p?'<small title="Letztes Mal">'+p+'</small>':'')+'</div>';

      h+='<div class="rir'+(ask?' ask':'')+'" role="group" aria-label="Wiederholungen in Reserve, Satz '+(si+1)+'"><span class="rir-l">'+(ask?'RIR fehlt: Wie viele Wdh. wären noch drin gewesen?':'RIR')+'</span><span class="rir-cs">'+[0,1,2,3,4].map(v=>'<button class="rir-c'+(x.rir===v?' on':'')+(t.rir&&v>=t.rir[0]&&v<=t.rir[1]?' tgt':'')+'" data-a="rir" '+sref+' data-v="'+v+'" aria-pressed="'+(x.rir===v)+'">'+(v===4?'4+':v)+'</button>').join('')+'</span></div>';
    }
  });
  const lastDone = e.sets.length>0 && e.sets[e.sets.length-1].done;
  h+='</div><div class="ex-foot"><div class="setctl" role="group" aria-label="Anzahl Sätze"><button data-a="rm-set" '+ref+' aria-label="Satz entfernen"'+(e.sets.length<=1||lastDone?' disabled':'')+'>−</button><span>'+e.sets.length+' '+(e.sets.length===1?'Satz':'Sätze')+'</span><button data-a="add-set" '+ref+' aria-label="Satz hinzufügen">+</button></div><span class="sp"></span>'+(EQUIP[def.equip].inc?'<button class="ghost-btn" data-a="steps-open" '+ref+'>Schritte</button>':'')+'<button class="ghost-btn" data-a="skip" '+ref+'>'+I.skip+'Auslassen</button></div>';
  h+='<details class="cue"><summary>'+I.info+'<span class="when-closed">Technik-Tipp anzeigen</span><span class="when-open">Technik-Tipp</span>'+I.chevD+'</summary><p>'+esc(def.cue)+'</p></details>';
  return h+'</article>';
}

function findPanel(s,bi,ii){
  const e=s.blocks[bi].items[ii], def=EX[e.ex], f=e.find, k=f.steps.length+1, tr=findTr(f), eq=EQUIP[def.equip];

function findRate(s, bi, ii, rating){
  const e=s.blocks[bi].items[ii], def=EX[e.ex], f=e.find, name=EX[e.ex].short||EX[e.ex].name;
  if(f.w==null && def.equip!=='bw' && !def.zero){ toast('Bitte zuerst das Gewicht eintragen.'); return; }
  const w=f.w==null?0:f.w, r=f.r!=null?f.r:e.target.reps[0];
  const kind=findDecide(e, rating, r), step={w, r, rating, kind, t:Date.now()};
  f.steps.push(step);
  const tr=findTr(f), L=x=>fmtLoad(x,def);
  let result, counted=false, reps=null, action, why;
  if(kind==='found'){ result=w; counted=true; action='found'; why='Arbeitsgewicht '+L(w)+'. Probesatz '+f.steps.length+' zählt als Satz 1.'; }
  else {
    if(kind==='down' && e.ex==='pullup' && r<e.target.reps[0]) f.suggestAssist=true;
    const nw=findNext(w, kind, f, def, findEst(e, def, w, r, rating));
    if(nw!=null){
      step.next=nw;
      // Zu leicht oder zu schwer: noch ein Probesatz. Passt er, zählt er als Satz 1, kostet also keinen Extrasatz.
      if(f.steps.length<FIND_MAX){
        f.w=nw; f.r=e.target.reps[0]; persist(s);
        Timer.start(FIND_REST, 'Probesatz '+(f.steps.length+1)+' · '+L(nw));
        return 'next';
      }
      result=nw; action=kind==='down'?'down':'up';
      why='Nach '+FIND_MAX+' Probesätzen übernommen: '+L(nw)+(kind==='down'?', etwas leichter als zuletzt.':', etwas schwerer als zuletzt.')+' Die Probesätze zählen nicht als Arbeitssätze.';
    } else {
      const {lo,hi}=findBounds(f, def);
      if(lo!=null){
        // Keine Gewichtsstufe mehr dazwischen: leichteres Gewicht, dafür mehr Wiederholungen.
        const ls=f.steps.filter(st=>st.w===lo && st.kind!=='down' && st.kind!=='found').pop();
        reps=Math.min(e.target.reps[1], Math.max(e.target.reps[0], ls.r + FIND_RIR[ls.rating] - tr[1]));
        result=lo; action='reps';
        why=(hi!=null ? 'Zwischen '+L(lo)+' und '+L(hi)+' gibt es keine Stufe.' : 'Schwerer geht hier nicht.')+' Nimm '+L(lo)+' und mach '+reps+' Wdh.'+(def.side?' pro Seite.':'');
      } else {
        result=w; action='down';
        if(e.ex==='pullup'){ f.suggestAssist=true; why='Ohne Hilfe heute zu schwer.'; }
        else why='Leichter geht hier nicht: '+L(w)+'. Mach so viele saubere Wdh., dass '+rirTxt(tr)+' in Reserve bleiben.';
      }
      step.next=result;
    }
  }
  f.status='done'; f.result=result; f.counted=counted; if(reps!=null) f.reps=reps; else delete f.reps;
  const n=e.target.sets, lo=e.target.reps[0], sets=[];
  if(counted) sets.push({w:result, r, rir:Math.max(tr[0], Math.min(tr[1], FIND_RIR[rating])), done:true, t:Date.now(), probe:true});
  while(sets.length<n) sets.push({w:result, r:reps!=null?reps:e.target.perSet[sets.length]!=null?e.target.perSet[sets.length]:lo, rir:null, done:false});
  e.sets=sets; e.target.w=result; e.target.action=action; e.target.reason=why; e.target.notes=(e.target.notes||[]).filter(n=>!/^Grosser Sprung/.test(n));
  persist(s);
  if(counted && !state.editId) afterSetDone(s,bi,ii,0);
  else Timer.start(FIND_REST, name+' · Satz 1 · '+L(result));
  return counted ? 'found' : 'done';
}

function findUndo(s, bi, ii){
  const e=s.blocks[bi].items[ii], f=e.find; if(!findCanUndo(e)) return;
  const last=f.steps.pop();
  f.status='active'; f.w=last.w; f.r=last.r; delete f.result; delete f.counted; delete f.reps; delete f.suggestAssist;
  e.target.action='find'; e.target.reason=f.why; e.target.w=null;
  e.sets=Array.from({length:e.target.sets}, (_,i)=>({w:null, r:e.target.perSet[i]!=null?e.target.perSet[i]:e.target.reps[0], rir:null, done:false}));
  persist(s);
}
